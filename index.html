<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f4e79">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>사회 실전 모의고사 – 교육청 시설관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --paper:#fffdf8; --ink:#1f2328; --muted:#6b6f76; --line:#e2ddd2;
  --accent:#1f4e79; --accent-soft:#e6eef6; --ok:#1d7a46; --ok-soft:#e5f3ea; --bad:#b4372f; --bad-soft:#fbe9e7;
  --u1:#1f4e79; --u2:#9a5b13; --u3:#5a3d8a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.65;font-size:16px}
.wrap{max-width:820px;margin:0 auto;padding:24px 18px 120px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:22px}
.kicker{font-size:13px;color:var(--muted);letter-spacing:.04em}
h1{font-family:"Noto Serif KR",serif;font-size:26px;margin:2px 0 0}
select,button{font:inherit}
select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px}
.intro h2{font-family:"Noto Serif KR",serif;margin:0 0 6px;font-size:22px}
.units{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.unit-chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;background:#fff}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.rules{color:var(--muted);font-size:14px;margin:0 0 18px;padding-left:18px}
.hist{margin-top:18px;font-size:14px;color:var(--muted)}
.hist b{color:var(--ink)}
/* questions */
.q{scroll-margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px 20px 14px;margin-bottom:14px}
.q.correct{border-color:#bfe0cb}
.q.wrong{border-color:#efc4bf}
.qhead{display:flex;gap:10px;align-items:baseline}
.qnum{font-weight:700;font-size:18px;min-width:30px;white-space:nowrap}
.qmeta{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.stem{margin:0;font-weight:500}
.box{white-space:pre-line;border:1px solid var(--line);background:#fbfaf6;border-radius:10px;padding:12px 14px;margin:12px 0 4px;font-size:15px}
.opts{list-style:none;padding:0;margin:12px 0 0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.opt:hover{background:#f3f0e8}
.opt .n{font-size:18px;line-height:1.4;min-width:20px}
.opt.sel{background:var(--accent-soft);border-color:#c5d6e8}
.done .opt{cursor:default}
.done .opt:hover{background:transparent}
.opt.is-ans{background:var(--ok-soft);border-color:#bfe0cb}
.opt.is-wrongpick{background:var(--bad-soft);border-color:#efc4bf}
.mark{font-weight:700;font-size:13px;padding:2px 8px;border-radius:999px}
.mark.o{background:var(--ok-soft);color:var(--ok)}
.mark.x{background:var(--bad-soft);color:var(--bad)}
details.exp{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
details.exp summary{cursor:pointer;color:var(--accent);font-weight:500;font-size:14px}
.exp ol{list-style:none;padding:0;margin:10px 0 0;font-size:14.5px}
.exp li{padding:4px 0;display:flex;gap:8px}
.exp li .tag{font-weight:700;min-width:20px}
.exp li.ans{color:var(--ok)}
/* bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,248,.97);border-top:1px solid var(--line);backdrop-filter:blur(6px)}
.bar .in{max-width:820px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px}
.timer.warn{color:var(--bad)}
.omr{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:200px}
.omr a{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);font-size:11px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--muted);background:#fff}
.omr a.f{background:var(--accent);color:#fff;border-color:var(--accent)}
.omr a.o{background:var(--ok);color:#fff;border-color:var(--ok)}
.omr a.x{background:var(--bad);color:#fff;border-color:var(--bad)}
/* result */
.result{margin-bottom:18px}
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font-family:"Noto Serif KR",serif;font-size:44px;font-weight:700}
.score .sub{color:var(--muted)}
.ubars{margin:16px 0 6px;display:grid;gap:10px}
.ubar{display:grid;grid-template-columns:90px 1fr 56px;gap:10px;align-items:center;font-size:14px}
.track{height:10px;background:#efebe2;border-radius:999px;overflow:hidden}
.fill{height:100%;border-radius:999px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.toggle{font-size:14px;display:flex;gap:6px;align-items:center;cursor:pointer}
.hide,.hide-v{display:none!important}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,20,20,.35);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal .card{max-width:380px}
.modal p{margin:0 0 16px}
.row{display:flex;gap:10px;justify-content:flex-end}
.tabs{display:flex;gap:6px;margin:-8px 0 20px}
.tab{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500;font-size:14px;color:var(--muted)}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab .cnt{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px}
.nhead{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.nhead .sp{flex:1}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:#c5d6e8;color:var(--accent);font-weight:700}
.nstats{font-size:14px;color:var(--muted)}
.nmeta{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:6px 0 0}
.nmeta .pill{background:#f1ede4;border-radius:999px;padding:1px 9px}
.nmeta .pill.hot{background:var(--bad-soft);color:var(--bad);font-weight:700}
.q.mastered{opacity:.6}
.nact{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.nact .btn{padding:7px 12px;font-size:13px}
textarea.memo{width:100%;min-height:54px;margin-top:10px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:14px;background:#fffef9;resize:vertical}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.saved{font-size:13px;color:var(--ok);margin-top:8px}
.notice{font-size:13px;color:var(--muted);margin:0 0 12px}
body{word-break:keep-all;overflow-wrap:anywhere;-webkit-text-size-adjust:100%}
.bar .in{padding-bottom:max(10px, env(safe-area-inset-bottom))}
.opt,.tab,.chip,.btn{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@media (max-width:560px){
  .wrap{padding:16px 12px 110px}
  header.top{margin-bottom:16px}
  .q{padding:16px 14px 12px;border-radius:12px}
  .qhead{gap:6px}
  .qnum{min-width:auto;font-size:17px}
  .box{padding:10px 12px;font-size:14.5px}
  .opt{padding:10px 8px;gap:8px}
  .bar .in{padding:8px 12px;gap:10px;flex-wrap:nowrap;padding-bottom:max(8px, env(safe-area-inset-bottom))}
  .timer{font-size:17px}
  .omr{flex-wrap:nowrap;overflow-x:auto;min-width:0;scrollbar-width:none;padding:2px 0}
  .omr::-webkit-scrollbar{display:none}
  .omr a{flex:0 0 28px;height:28px}
  .bar .btn{padding:9px 14px}
  .card{padding:18px 16px}
  .ubar{grid-template-columns:78px 1fr 44px}
  .tools .btn{flex:1;white-space:nowrap}
  .tools .toggle{flex-basis:100%}
}
@media (max-width:560px){.nmeta{margin-left:0}h1{font-size:22px}.qmeta{display:none}.score .big{font-size:36px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="kicker">교육청 시설관리 · 사회 25문항</div>
      <h1>사회 실전 모의고사</h1>
    </div>
    <label>회차 <select id="roundSel"></select></label>
  </header>
  <nav class="tabs">
    <button class="tab on" data-v="exam">모의고사</button>
    <button class="tab" data-v="notes">오답노트 <span class="cnt hide" id="ncnt"></span></button>
  </nav>

  <section id="notes" class="hide"></section>
  <section id="intro" class="card intro"></section>
  <section id="result" class="card result hide"></section>
  <section id="exam" class="hide"></section>
</div>

<div class="bar hide" id="bar"><div class="in">
  <span class="timer" id="timer">25:00</span>
  <div class="omr" id="omr"></div>
  <button class="btn" id="submitBtn">제출</button>
</div></div>

<div class="modal hide" id="modal"><div class="card">
  <p id="modalMsg"></p>
  <div class="row"><button class="btn ghost" id="mCancel">계속 풀기</button><button class="btn" id="mOk">제출하기</button></div>
</div></div>

<script>
const ROUNDS = [{"round": 1, "title": "실전 모의고사 1회", "questions": [{"unit": "정치와 법", "topic": "정치를 보는 관점", "stem": "다음은 정치를 보는 두 관점이다. 이에 대한 설명으로 옳은 것은?", "box": "갑: 정치란 국가 고유의 현상으로, 국가 권력의 획득·유지·행사와 관련된 활동이다.\n을: 정치란 국가뿐 아니라 모든 사회 집단에서 나타나는 이해관계 조정과 갈등 해결 활동이다.", "opts": ["을의 관점은 다원화된 현대 사회의 다양한 정치 현상을 설명하는 데 적합하다.", "을의 관점은 국가의 정치와 일반 사회 집단의 정치를 구분하는 데 유리하다.", "갑의 관점에 따르면 학급 회의에서 청소 당번 규칙을 정하는 것도 정치에 해당한다.", "갑은 정치를 넓은 의미로 이해한다."], "why": ["을은 넓은 의미의 정치(집단 현상설)로, 다원화된 현대 사회의 정치 현상 설명에 유리하다.", "국가와 일반 집단의 정치를 구분하는 데 유리한 것은 갑(국가 현상설)이다.", "학급 회의는 국가 권력과 무관하므로 을의 관점에서만 정치이다.", "갑은 국가 현상설, 즉 좁은 의미의 정치이다."], "ans": 0}, {"unit": "정치와 법", "topic": "사회 계약설", "stem": "다음은 사상가 A~C의 주장이다. 이에 대한 설명으로 옳은 것은? (단, A~C는 각각 홉스, 로크, 루소 중 하나이다.)", "box": "A: 자연 상태는 '만인의 만인에 대한 투쟁' 상태이므로, 개인은 자연권을 군주에게 전부 양도해야 한다.\nB: 자연 상태는 비교적 평화롭지만 자연권 보장이 불안정하므로, 자연권의 일부를 대표자에게 신탁해야 한다.\nC: 주권은 양도·대표될 수 없으며, 일반 의지에 따라 행사되어야 한다.", "opts": ["A~C는 모두 왕권신수설을 근거로 국가 권력의 정당성을 설명한다.", "A는 시민의 저항권을 적극적으로 인정한다.", "C는 대의 민주제를 가장 이상적인 정치 형태로 본다.", "B는 정부가 신탁을 위반하면 시민이 저항할 수 있다고 본다."], "why": ["세 사상가 모두 왕권신수설이 아닌 사회 계약으로 국가의 정당성을 설명한다.", "A(홉스)는 절대 군주에 대한 저항권을 인정하지 않았다.", "C(루소)는 주권이 대표될 수 없다고 보아 직접 민주제를 강조하였다.", "B는 로크로, 신탁 위반 시 저항권을 인정하였다."], "ans": 3}, {"unit": "정치와 법", "topic": "정부 형태", "stem": "갑국과 을국의 정부 형태에 대한 설명으로 옳은 것은? (단, 갑국과 을국은 각각 전형적인 대통령제와 의원 내각제 중 하나를 채택하고 있다.)", "box": "• 갑국: 행정부 수반은 의회를 해산할 수 있고, 의회는 내각을 불신임할 수 있다.\n• 을국: 행정부 수반은 국민이 직접 선출하며, 임기 동안 의회의 불신임을 받지 않는다.", "opts": ["갑국은 을국보다 입법부와 행정부 간 권력 분립이 엄격하다.", "갑국에서는 의회 의원이 내각의 각료를 겸직할 수 없다.", "을국의 행정부 수반은 의회가 의결한 법률안에 대해 거부권을 행사할 수 있다.", "을국에서는 내각이 의회에 대해 연대 책임을 진다."], "why": ["권력 분립이 엄격한 것은 대통령제인 을국이다.", "의원 내각제(갑국)는 의원의 각료 겸직이 일반적으로 허용된다.", "을국은 대통령제로, 대통령은 법률안 거부권으로 의회를 견제한다.", "내각의 대(對)의회 연대 책임은 의원 내각제(갑국)의 특징이다."], "ans": 2}, {"unit": "정치와 법", "topic": "국회와 대통령의 권한", "stem": "우리나라 국가 기관에 대한 설명으로 옳은 것은?", "box": null, "opts": ["정부는 국회에 법률안을 제출할 수 있다.", "국회는 재적 의원 과반수의 찬성으로 헌법 개정안을 의결한다.", "대법원장은 대법관 회의의 동의를 얻어 대통령이 임명한다.", "대통령은 국회의 동의   try{ if(typeof claude !== "undefined" && claude.use) db = await claude.use("db"); }catch(e){ db = null; }
  if(!db){ NB.status = "local"; nbChanged(); return; }
  NB.db = db; NB.mode = "db";
  const t = setTimeout(()=>{ NB.status = "slow"; nbChanged(); }, 10000);
  db.collection("wrong").onSnapshot(snap=>{
    if(!snap.metadata.fromCache){ clearTimeout(t); NB.status = "ok"; }
    const it = {}; snap.docs.forEach(d=>{ it[d.id] = d.data(); }); NB.items = it; nbChanged();
  }, err=>{
    clearTimeout(t); NB.db = null; NB.mode = "local"; NB.status = "local"; nbLocalLoad(); nbChanged();
  });
}
async function nbPut(key, obj){
  NB.items = {...NB.items, [key]: obj};
  if(NB.mode === "db" && NB.db){
    try{ await NB.db.doc("wrong/"+key).set(obj); }
    catch(e){
      if(e && e.code === "quota_exceeded"){ NB.status = "full"; }
      else { NB.mode = "local"; NB.status = "local"; nbLocalSave(); }
    }
  } else nbLocalSave();
  nbChanged();
}
async function nbAttempt(rec){
  if(NB.mode === "db" && NB.db){ try{ await NB.db.collection("attempts").add(rec); }catch(e){} }
}
function nbChanged(){
  const open = Object.values(NB.items).filter(x=>!x.mastered).length;
  const c = $("#ncnt"); if(c){ c.textContent = open; c.classList.toggle("hide", !open); }
  if(view === "notes") renderNotes();
}

/* ───── 화면 전환 ───── */
let view = "exam", nUnit = "전체", hideMastered = true, coverAns = false, revealed = new Set();
function setView(v){
  view = v;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on", b.dataset.v===v));
  const ex = v === "exam";
  $("#notes").classList.toggle("hide", ex);
  ["#intro","#result","#exam","#bar"].forEach(s=>$(s).classList.toggle("hide-v", !ex));
  try{ history.replaceState(null, "", ex ? location.pathname + location.search : "#notes"); }catch(e){}
  if(!ex) renderNotes();
  window.scrollTo(0,0);
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>setView(b.dataset.v));
window.addEventListener("hashchange", ()=>setView(location.hash==="#notes"?"notes":"exam"));

function renderNotes(){
  const all = Object.entries(NB.items).map(([k,v])=>({key:k, ...v}));
  const list = all
    .filter(x => nUnit==="전체" || x.unit===nUnit)
    .filter(x => !(hideMastered && x.mastered))
    .sort((a,b)=> (b.wrongCount||0)-(a.wrongCount||0) || String(b.lastWrong).localeCompare(String(a.lastWrong)) || a.round-b.round || a.qno-b.qno);
  const open = all.filter(x=>!x.mastered).length, done = all.length - open;
  const units = ["전체","정치와 법","경제","사회·문화"];
  const note = NB.status==="local" ? "이 브라우저에만 저장되고 있어요. 다른 기기나 브라우저에서는 보이지 않을 수 있어요."
    : NB.status==="slow" ? "저장소에 연결하는 중이에요. 표시된 내용이 최신이 아닐 수 있어요."
    : NB.status==="full" ? "저장 공간이 가득 차 새 오답을 저장하지 못했어요. 복습 완료한 문항을 정리해 주세요." : "";
  $("#notes").innerHTML = `
    <div class="nhead">
      <div class="filters">${units.map(u=>`<button class="chip ${u===nUnit?"on":""}" data-u="${u}">${u}</button>`).join("")}</div>
      <span class="sp"></span>
      <span class="nstats">복습할 문항 <b>${open}</b> · 복습 완료 ${done}</span>
    </div>
    <div class="nhead">
      <label class="toggle"><input type="checkbox" id="hideM" ${hideMastered?"checked":""}> 복습 완료 숨기기</label>
      <label class="toggle"><input type="checkbox" id="coverA" ${coverAns?"checked":""}> 정답 가리고 다시 풀기</label>
    </div>
    ${note?`<p class="notice">${note}</p>`:""}
    ${list.length ? list.map(noteCard).join("") : `<div class="card empty">${all.length? "조건에 맞는 오답이 없어요." : "아직 저장된 오답이 없어요.<br>모의고사를 풀고 제출하면 틀린 문항이 여기에 자동으로 모여요."}</div>`}
  `;
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ nUnit=b.dataset.u; renderNotes(); });
  $("#hideM").onchange = e => { hideMastered = e.target.checked; renderNotes(); };
  $("#coverA").onchange = e => { coverAns = e.target.checked; revealed = new Set(); renderNotes(); };
  document.querySelectorAll("[data-master]").forEach(b=>b.onclick=async()=>{
    const k=b.dataset.master, x={...NB.items[k]}; x.mastered=!x.mastered; x.masteredAt = x.mastered?today():null; await nbPut(k,x);
  });
  document.querySelectorAll("textarea.memo").forEach(t=>t.onchange=async()=>{
    const k=t.dataset.k, x={...NB.items[k]}; if((x.memo||"")===t.value) return; x.memo=t.value; await nbPut(k,x);
  });
  document.querySelectorAll("#notes .opt").forEach(el=>el.onclick=()=>{
    const k=el.dataset.k; if(!coverAns || revealed.has(k)) return;
    revealed.add(k); _tries[k] = +el.dataset.o; renderNotes();
  });
  document.querySelectorAll("[data-reveal]").forEach(b=>b.onclick=()=>{ revealed.add(b.dataset.reveal); renderNotes(); });
}
const _tries = {};
function noteCard(x){
  const hidden = coverAns && !revealed.has(x.key);
  const tryPick = _tries[x.key];
  return `<article class="q ${x.mastered?"mastered":""} ${hidden?"":"done"}">
    <div class="qhead"><span class="qnum" style="min-width:auto">${x.round}회 ${x.qno}번</span>
      <span class="qmeta" style="margin-left:auto"><span class="dot" style="background:${UNIT_COLOR[x.unit]}"></span>${x.unit} · ${esc(x.topic)}</span></div>
    <div class="nmeta">
      <span class="pill ${x.wrongCount>1?"hot":""}">틀린 횟수 ${x.wrongCount||1}</span>
      <span class="pill">최근 오답 ${esc(x.lastWrong||"")}</span>
      ${x.lastRight?`<span class="pill">최근 정답 ${esc(x.lastRight)}</span>`:""}
      ${x.mastered?`<span class="pill">복습 완료</span>`:""}
    </div>
    <p class="stem" style="margin-top:10px">${esc(x.stem)}</p>
    ${x.box?`<div class="box">${esc(x.box)}</div>`:""}
    <ul class="opts">${x.opts.map((o,j)=>{
      let c="";
      if(!hidden){ if(j===x.ans) c="is-ans"; else if(j===x.myPick) c="is-wrongpick"; }
      return `<li class="opt ${c}" data-k="${x.key}" data-o="${j}"><span class="n">${CIRC[j]}</span><span>${esc(o)}${!hidden&&j===x.myPick&&j!==x.ans?' <span class="mark x">내가 고른 답</span>':""}</span></li>`;
    }).join("")}</ul>
    ${!hidden && tryPick!=null ? `<p class="saved" style="color:${tryPick===x.ans?"var(--ok)":"var(--bad)"}">다시 푼 답 ${CIRC[tryPick]} → ${tryPick===x.ans?"정답이에요!":"또 틀렸어요. 해설을 꼭 확인하세요."}</p>`:""}
    ${hidden?`<div class="nact"><span class="nstats">답을 골라 보거나</span><button class="btn ghost" data-reveal="${x.key}">정답·해설 보기</button></div>`:`
    <details class="exp" open><summary>정답 ${CIRC[x.ans]}${x.myPick!=null&&x.myPick>=0?` · 내 답 ${CIRC[x.myPick]}`:" · 미응답"} — 선지별 해설</summary>
      <ol>${x.why.map((w,j)=>`<li class="${j===x.ans?"ans":""}"><span class="tag">${CIRC[j]}</span><span>${j===x.ans?"(O) ":"(X) "}${esc(w)}</span></li>`).join("")}</ol>
    </details>`}
    <textarea class="memo" data-k="${x.key}" placeholder="나의 메모 — 왜 틀렸는지, 헷갈린 개념을 적어 두세요">${esc(x.memo||"")}</textarea>
    <div class="nact"><button class="btn ${x.mastered?"ghost":""}" data-master="${x.key}">${x.mastered?"다시 복습 목록으로":"복습 완료"}</button></div>
  </article>`;
}

async function saveOne(r, i){
  const q = r.questions[i], key = `r${r.round}-q${i+1}`, ex = NB.items[key];
  const pick = picks[i]==null ? -1 : picks[i];
  if(pick === q.ans) return false;
  const base = ex ? {...ex} : {round:r.round, qno:i+1, title:r.title, unit:q.unit, topic:q.topic, stem:q.stem, box:q.box, opts:q.opts, why:q.why, ans:q.ans, wrongCount:0, firstWrong:today(), memo:""};
  base.myPick = pick; base.wrongCount = (base.wrongCount||0)+1; base.lastWrong = today(); base.mastered = false; base.masteredAt = null;
  savedRun.add(i);
  await nbPut(key, base);
  return true;
}
async function markRight(r, i){
  const key = `r${r.round}-q${i+1}`, ex = NB.items[key];
  if(picks[i] === r.questions[i].ans && ex && ex.lastRight !== today()) await nbPut(key, {...ex, lastRight: today()});
}
async function saveWrongs(r, onlyUnsaved){
  let n = 0;
  for(let i=0;i<r.questions.length;i++){
    if(picks[i] === r.questions[i].ans){ await markRight(r, i); continue; }
    if(onlyUnsaved && savedRun.has(i)) continue;
    if(await saveOne(r, i)) n++;
  }
  return n;
}
function wrongList(r){ return r.questions.map((q,i)=>picks[i]===q.ans?null:i+1).filter(Boolean); }

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmt(sec){ const m=Math.floor(Math.abs(sec)/60), s=Math.abs(sec)%60; return (sec<0?"-":"")+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); }

function unitCounts(r){
  const c = {}; r.questions.forEach(q=>c[q.unit]=(c[q.unit]||0)+1); return c;
}

function renderSel(){
  $("#roundSel").innerHTML = ROUNDS.map((r,i)=>`<option value="${i}">${r.round}회</option>`).join("");
  $("#roundSel").value = cur;
  $("#roundSel").onchange = e => { cur = +e.target.value; reset(); };
}

function renderIntro(){
  const r = ROUNDS[cur], uc = unitCounts(r);
  const h = store.get("socexam-hist-"+r.round) || [];
  $("#intro").innerHTML = `
    <h2>${esc(r.title)}</h2>
    <div class="units">${Object.entries(uc).map(([u,n])=>`<span class="unit-chip"><span class="dot" style="background:${UNIT_COLOR[u]}"></span>${u} ${n}문항</span>`).join("")}</div>
    <ul class="rules">
      <li>4지선다 25문항, 문항당 4점(100점 만점)</li>
      <li>권장 시간 25분 (실제 시험은 2과목 50문항 50분, 문항당 약 1분)</li>
      <li>시간이 지나도 계속 풀 수 있고, 초과 시간이 빨간색으로 표시돼요.</li>
      <li><b>실전 모드</b>: 다 풀고 제출하면 한꺼번에 채점해요.</li>
      <li><b>연습 모드</b>: 보기를 고르고 <b>제출하고 채점하기</b>를 누르면 그 문제의 정답과 해설이 바로 나와요. 틀린 문제는 <b>오답노트에 저장</b> 버튼으로 골라서 저장해요.</li>
      <li>실전 모드는 제출할 때 틀린 문항이 오답노트에 자동 저장돼요.</li>
    </ul>
    <div class="tools" style="margin-top:0">
      <button class="btn" id="startBtn">실전 모드로 시작</button>
      <button class="btn ghost" id="practiceBtn">연습 모드 (바로 채점)</button>
    </div>
    ${h.length?`<div class="hist">이 브라우저에 남은 기록: ${h.slice(-5).map(x=>`<b>${x.score}점</b> (${x.date}, ${fmt(x.time)})`).join(" · ")}</div>`:""}
  `;
  $("#startBtn").onclick = () => start(false);
  $("#practiceBtn").onclick = () => start(true);
}

function renderExam(){
  const r = ROUNDS[cur];
  $("#exam").innerHTML = r.questions.map((q,i)=>{
    const done = submitted || (practice && checked[i]), ok = done && picks[i]===q.ans;
    const pendingCheck = practice && !submitted && !checked[i];
    const cls = done ? (ok?"correct":"wrong") : "";
    if (submitted && onlyWrong && ok) return "";
    return `<article class="q ${cls} ${done?"done":""}" id="q${i+1}">
      <div class="qhead"><span class="qnum">${i+1}.</span>
        <p class="stem">${esc(q.stem)}</p>
        <span class="qmeta"><span class="dot" style="background:${UNIT_COLOR[q.unit]}"></span>${q.unit} · ${esc(q.topic)}</span>
      </div>
      ${q.box?`<div class="box">${esc(q.box)}</div>`:""}
      <ul class="opts">${q.opts.map((o,j)=>{
        let c = "";
        if(!done && picks[i]===j) c="sel";
        if(done && j===q.ans) c="is-ans";
        if(done && picks[i]===j && j!==q.ans) c="is-wrongpick";
        return `<li class="opt ${c}" data-q="${i}" data-o="${j}"><span class="n">${CIRC[j]}</span><span>${esc(o)}</span></li>`;
      }).join("")}</ul>
      ${pendingCheck?`<div class="nact"><button class="btn" data-check="${i}" ${picks[i]==null?"disabled":""}>제출하고 채점하기</button>${picks[i]==null?'<span class="nstats">보기를 먼저 골라 주세요</span>':""}</div>`:""}
      ${practice && done && !ok ? `<div class="nact">${savedRun.has(i)?'<span class="saved" style="margin:0">✓ 오답노트에 저장했어요</span> <a href="#notes" style="font-size:13px">오답노트 보기</a>':`<button class="btn ghost" data-save="${i}">오답노트에 저장</button>`}</div>`:""}
      ${done?`<details class="exp" ${ok&&!(practice&&!submitted)?"":"open"}>
        <summary>${ok?'<span class="mark o">정답</span>':'<span class="mark x">오답</span>'} &nbsp;정답 ${CIRC[q.ans]}${picks[i]!=null&&!ok?` · 내 답 ${CIRC[picks[i]]}`:(picks[i]==null?" · 미응답":"")} — 해설 보기</summary>
        <ol>${q.why.map((w,j)=>`<li class="${j===q.ans?"ans":""}"><span class="tag">${CIRC[j]}</span><span>${j===q.ans?"(O) ":"(X) "}${esc(w)}</span></li>`).join("")}</ol>
      </details>`:""}
    </article>`;
  }).join("");
  if(!submitted){
    document.querySelectorAll("#exam .opt").forEach(el=>el.onclick=()=>{
      const qi=+el.dataset.q, oi=+el.dataset.o;
      if(practice && checked[qi]) return;
      picks[qi] = picks[qi]===oi ? null : oi;
      renderExam(); renderOmr();
    });
    document.querySelectorAll("[data-check]").forEach(b=>b.onclick=()=>{
      const i=+b.dataset.check; if(picks[i]==null) return;
      checked[i] = true; renderExam(); renderOmr();
      markRight(ROUNDS[cur], i);
    });
  }
  document.querySelectorAll("[data-save]").forEach(b=>b.onclick=async()=>{
    b.disabled = true; b.textContent = "저장 중…";
    await saveOne(ROUNDS[cur], +b.dataset.save); renderExam();
    if(submitted) updUnsaved();
  });
}

function renderOmr(){
  const r = ROUNDS[cur];
  $("#omr").innerHTML = r.questions.map((q,i)=>{
    let c = "";
    if(submitted || (practice && checked[i])) c = picks[i]===q.ans ? "o" : "x";
    else if(picks[i]!=null) c = "f";
    return `<a href="javascript:void 0" data-go="${i+1}" class="${c}">${i+1}</a>`;
  }).join("");
  document.querySelectorAll("#omr a").forEach(a=>a.onclick=e=>{ e.preventDefault(); const el=document.getElementById("q"+a.dataset.go); el && el.scrollIntoView({behavior:"smooth", block:"start"}); });
  if(practice && !submitted){
    const n = checked.filter(Boolean).length, c = picks.filter((p,i)=>checked[i] && p===r.questions[i].ans).length;
    $("#submitBtn").textContent = n===r.questions.length ? "결과 보기" : `결과 ${c}/${n}`;
  } else $("#submitBtn").textContent = "제출";
}

function start(mode){
  practice = !!mode; savedRun = new Set();
  checked = Array(ROUNDS[cur].questions.length).fill(false);
  picks = Array(ROUNDS[cur].questions.length).fill(null);
  submitted = false; onlyWrong = false; started = Date.now();
  $("#intro").classList.add("hide"); $("#result").classList.add("hide");
  $("#exam").classList.remove("hide"); $("#bar").classList.remove("hide");
  $("#submitBtn").classList.remove("hide");
  renderExam(); renderOmr();
  clearInterval(tick); tick = setInterval(updTimer, 500); updTimer();
  window.scrollTo(0,0);
}
function elapsed(){ return Math.floor((Date.now()-started)/1000); }
function updTimer(){
  const left = LIMIT - elapsed();
  $("#timer").textContent = fmt(left);
  $("#timer").classList.toggle("warn", left < 180);
}

function askSubmit(){
  const n = practice ? checked.filter(x=>!x).length : picks.filter(p=>p==null).length;
  if(n===0) return submit();
  $("#modalMsg").textContent = practice ? `아직 채점하지 않은 문항이 ${n}개 있어요. 지금 결과를 볼까요? (고른 답은 함께 채점돼요)` : `아직 풀지 않은 문항이 ${n}개 있어요. 그래도 제출할까요?`;
  $("#modal").classList.remove("hide");
}

function submit(){
  $("#modal").classList.add("hide");
  submitted = true; clearInterval(tick);
  const r = ROUNDS[cur], t = elapsed();
  const per = {}; let correct = 0;
  r.questions.forEach((q,i)=>{
    per[q.unit] = per[q.unit] || {c:0,n:0}; per[q.unit].n++;
    if(picks[i]===q.ans){ per[q.unit].c++; correct++; }
  });
  const score = correct*4;
  const h = store.get("socexam-hist-"+r.round) || [];
  const d = new Date(); h.push({score, time:t, date:`${d.getMonth()+1}/${d.getDate()}`});
  store.set("socexam-hist-"+r.round, h.slice(-20));

  $("#result").innerHTML = `
    <div class="score"><span class="big">${score}점</span><span class="sub">${correct} / ${r.questions.length} 정답 · 풀이 시간 ${fmt(t)}${t>LIMIT?" (권장 시간 초과)":""}</span></div>
    <div class="ubars">${Object.entries(per).map(([u,v])=>`
      <div class="ubar"><span><span class="dot" style="background:${UNIT_COLOR[u]}"></span>${u}</span>
      <div class="track"><div class="fill" style="width:${v.c/v.n*100}%;background:${UNIT_COLOR[u]}"></div></div>
      <span>${v.c}/${v.n}</span></div>`).join("")}</div>
    <div class="tools">
      <label class="toggle"><input type="checkbox" id="onlyWrong"> 틀린 문항만 보기</label>
      <button class="btn ghost" id="copyBtn">오답 번호 복사</button>
      <button class="btn" id="retryBtn">다시 풀기</button>
      <span id="copyMsg" class="sub" style="font-size:13px;color:var(--muted)"></span>
    </div>
    <p class="saved" id="saveMsg">오답노트에 저장하는 중…</p>`;
  const rec = {round:r.round, mode:practice?"연습":"실전", score, correct, time:t, date:today(), at:new Date().toISOString(), wrong:wrongList(r)};
  if(!practice){
    saveWrongs(r, false).then(n=>{
      const m = $("#saveMsg"); if(m) m.innerHTML = n ? `틀린 문항 ${n}개를 오답노트에 저장했어요. <a href="#notes">오답노트 보기 →</a>` : "모두 맞혔어요! 저장할 오답이 없어요.";
      nbAttempt(rec);
    });
  } else { updUnsaved(); nbAttempt(rec); }
  $("#result").classList.remove("hide");
  $("#submitBtn").classList.add("hide");
  $("#onlyWrong").onchange = e => { onlyWrong = e.target.checked; renderExam(); };
  $("#retryBtn").onclick = () => start(practice);
  $("#copyBtn").onclick = async () => {
    const wrong = r.questions.map((q,i)=>picks[i]===q.ans?null:`${i+1}번(${q.topic})`).filter(Boolean);
    const txt = `${r.title} ${score}점 / 오답: ${wrong.join(", ")||"없음"}`;
    try{ await navigator.clipboard.writeText(txt); $("#copyMsg").textContent="복사했어요. 오답노트 만들 때 붙여 넣어 주세요."; }
    catch(e){ $("#copyMsg").textContent = txt; }
  };
  renderExam(); renderOmr();
  window.scrollTo(0,0);
}

function updUnsaved(){
  const m = $("#saveMsg"); if(!m) return;
  const r = ROUNDS[cur], w = wrongList(r), un = w.filter(n=>!savedRun.has(n-1));
  if(!w.length){ m.innerHTML = "모두 맞혔어요!"; return; }
  m.innerHTML = un.length
    ? `오답노트에 저장한 문항 ${w.length-un.length}개 · 저장 안 한 오답 ${un.length}개 <button class="btn ghost" id="saveRest" style="padding:5px 10px;font-size:13px;margin-left:6px">남은 오답 모두 저장</button>`
    : `틀린 문항 ${w.length}개가 모두 오답노트에 있어요. <a href="#notes">오답노트 보기 →</a>`;
  const b = $("#saveRest");
  if(b) b.onclick = async()=>{ b.disabled=true; b.textContent="저장 중…"; await saveWrongs(r, true); renderExam(); updUnsaved(); };
}

function reset(){
  clearInterval(tick); submitted=false;
  $("#intro").classList.remove("hide"); $("#result").classList.add("hide");
  $("#exam").classList.add("hide"); $("#bar").classList.add("hide");
  renderIntro();
}

$("#submitBtn").onclick = askSubmit;
$("#mCancel").onclick = () => $("#modal").classList.add("hide");
$("#mOk").onclick = submit;
renderSel(); reset();
setView(location.hash === "#notes" ? "notes" : "exam");
nbInit();
</script>
<script>
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
</body>

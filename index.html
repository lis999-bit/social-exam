<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f4e79">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>사회 실전 모의고사 – 교육청 시설관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --paper:#fffdf8; --ink:#1f2328; --muted:#6b6f76; --line:#e2ddd2;
  --accent:#1f4e79; --accent-soft:#e6eef6; --ok:#1d7a46; --ok-soft:#e5f3ea; --bad:#b4372f; --bad-soft:#fbe9e7;
  --u1:#1f4e79; --u2:#9a5b13; --u3:#5a3d8a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.65;font-size:16px}
.wrap{max-width:820px;margin:0 auto;padding:24px 18px 120px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:22px}
.kicker{font-size:13px;color:var(--muted);letter-spacing:.04em}
h1{font-family:"Noto Serif KR",serif;font-size:26px;margin:2px 0 0}
select,button{font:inherit}
select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px}
.intro h2{font-family:"Noto Serif KR",serif;margin:0 0 6px;font-size:22px}
.units{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.unit-chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;background:#fff}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.rules{color:var(--muted);font-size:14px;margin:0 0 18px;padding-left:18px}
.hist{margin-top:18px;font-size:14px;color:var(--muted)}
.hist b{color:var(--ink)}
/* questions */
.q{scroll-margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px 20px 14px;margin-bottom:14px}
.q.correct{border-color:#bfe0cb}
.q.wrong{border-color:#efc4bf}
.qhead{display:flex;gap:10px;align-items:baseline}
.qnum{font-weight:700;font-size:18px;min-width:30px;white-space:nowrap}
.qmeta{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.stem{margin:0;font-weight:500}
.box{white-space:pre-line;border:1px solid var(--line);background:#fbfaf6;border-radius:10px;padding:12px 14px;margin:12px 0 4px;font-size:15px}
.opts{list-style:none;padding:0;margin:12px 0 0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.opt:hover{background:#f3f0e8}
.opt .n{font-size:18px;line-height:1.4;min-width:20px}
.opt.sel{background:var(--accent-soft);border-color:#c5d6e8}
.done .opt{cursor:default}
.done .opt:hover{background:transparent}
.opt.is-ans{background:var(--ok-soft);border-color:#bfe0cb}
.opt.is-wrongpick{background:var(--bad-soft);border-color:#efc4bf}
.mark{font-weight:700;font-size:13px;padding:2px 8px;border-radius:999px}
.mark.o{background:var(--ok-soft);color:var(--ok)}
.mark.x{background:var(--bad-soft);color:var(--bad)}
details.exp{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
details.exp summary{cursor:pointer;color:var(--accent);font-weight:500;font-size:14px}
.exp ol{list-style:none;padding:0;margin:10px 0 0;font-size:14.5px}
.exp li{padding:4px 0;display:flex;gap:8px}
.exp li .tag{font-weight:700;min-width:20px}
.exp li.ans{color:var(--ok)}
/* bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,248,.97);border-top:1px solid var(--line);backdrop-filter:blur(6px)}
.bar .in{max-width:820px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px}
.timer.warn{color:var(--bad)}
.omr{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:200px}
.omr a{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);font-size:11px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--muted);background:#fff}
.omr a.cur{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink);font-weight:700;color:var(--ink)}
.omr a.f.cur,.omr a.o.cur,.omr a.x.cur{color:#fff}
.omr{padding:4px 2px!important}
.omr a.f{background:var(--accent);color:#fff;border-color:var(--accent)}
.omr a.o{background:var(--ok);color:#fff;border-color:var(--ok)}
.omr a.x{background:var(--bad);color:#fff;border-color:var(--bad)}
/* result */
.result{margin-bottom:18px}
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font-family:"Noto Serif KR",serif;font-size:44px;font-weight:700}
.score .sub{color:var(--muted)}
.ubars{margin:16px 0 6px;display:grid;gap:10px}
.ubar{display:grid;grid-template-columns:90px 1fr 56px;gap:10px;align-items:center;font-size:14px}
.track{height:10px;background:#efebe2;border-radius:999px;overflow:hidden}
.fill{height:100%;border-radius:999px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.toggle{font-size:14px;display:flex;gap:6px;align-items:center;cursor:pointer}
.hide,.hide-v{display:none!important}
.tcard .thead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.tcard h2{font-family:"Noto Serif KR",serif;margin:2px 0 0;font-size:22px}
.streak{background:var(--accent);color:#fff;border-radius:12px;padding:8px 12px;text-align:center;font-size:13px;white-space:nowrap}
.streak b{display:block;font-size:24px;line-height:1.1}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:14px}
.dday{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);border-radius:7px;padding:3px 0;background:#f1ede4;font-weight:700}
.dday b{font-weight:400;font-size:10px}
.dday.o{background:var(--ok);color:#fff}.dday.o b{color:#d9efe2}
.dday.x{background:var(--bad);color:#fff}.dday.x b{color:#f6d6d2}
.dday.now{outline:2px solid var(--accent);background:#fff}
.modebar{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.modebar .sp{flex:1}
.modebar .btn{padding:7px 14px;font-size:13px}
.modetag{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px}
.modetag.re{background:var(--ink);color:#fff}
.modetag.pr{background:var(--accent-soft);color:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#ebe6db;border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{font:inherit;font-weight:700;font-size:14px;border:0;background:transparent;border-radius:9px;padding:9px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sumbox{margin-top:12px;border:1px solid #e7d9a6;background:#fffbea;border-radius:12px;padding:10px 14px}
.sumh{font-weight:700;font-size:13.5px;color:#8a6a00;margin-bottom:4px}
.sumbox ul{margin:0;padding-left:18px;font-size:14.5px}
.sumbox summary{cursor:pointer}
.sumbox .sconcept{font-size:14.5px}
.sumbox li{margin:2px 0}
.sumbox .tip{margin-top:6px;font-weight:700;font-size:14px}
.sheetview{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px}

@media print{
  body.printing-sheet *{visibility:hidden}
  body.printing-sheet .sheetview, body.printing-sheet .sheetview *{visibility:visible}
  body.printing-sheet .sheetview{position:absolute;left:0;top:0;width:100%;border:0;padding:0}
  .bar,.tabs{display:none!important}
}
.oxrand{display:block;width:100%;margin-top:14px;padding:15px;font-size:17px;border-radius:14px}
.oxstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.oxstat div{background:#f6f3ec;border-radius:12px;padding:10px 6px;text-align:center}
.oxstat b{display:block;font-size:22px;font-family:"Noto Serif KR",serif}
.oxstat span{font-size:12px;color:var(--muted)}
.oxlabel{font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:700}
.oxcard{padding:22px 20px 18px}
.oxs{font-size:19px;font-weight:500;line-height:1.6;margin:14px 0 18px}
.oxbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.oxb{font:inherit;font-size:44px;font-weight:700;height:96px;border-radius:16px;border:2px solid var(--line);background:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.oxb.o{color:#1f6fb2}.oxb.x{color:var(--bad)}
.oxb:not(:disabled):active{transform:scale(.97)}
.oxb.is-ans{background:var(--ok-soft);border-color:var(--ok)}
.oxb.is-wrong{background:var(--bad-soft);border-color:var(--bad)}
.oxb:disabled:not(.is-ans):not(.is-wrong){opacity:.4}
.oxexp{margin:8px 0 0;font-size:15px;background:#fbfaf6;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.oxh{font-size:16px;margin:20px 0 10px}
.oxrev{display:flex;gap:12px;align-items:flex-start;padding:14px}
.oxans{flex:0 0 36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:18px}
.oxans.o{background:#1f6fb2}.oxans.x{background:var(--bad)}
.slider{position:relative;overflow:hidden;touch-action:pan-y}
.slide{will-change:transform}
.slide.in-next{animation:inNext .28s ease-out}
.slide.in-prev{animation:inPrev .28s ease-out}
@keyframes inNext{from{transform:translateX(70px);opacity:0}to{transform:none;opacity:1}}
@keyframes inPrev{from{transform:translateX(-70px);opacity:0}to{transform:none;opacity:1}}
.slide.out-next{transition:transform .18s ease-in,opacity .18s;transform:translateX(-110%);opacity:0}
.slide.out-prev{transition:transform .18s ease-in,opacity .18s;transform:translateX(110%);opacity:0}
.slide.snap{transition:transform .2s ease-out}
.pager{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.pager .pos{flex:1;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.pager .pos small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.pager .btn{padding:8px 14px}
.swipehint{text-align:center;font-size:12px;color:var(--muted);margin:10px 0 0}
.rlog{display:inline-flex;gap:3px;align-items:center}
.rl{font-style:normal;font-size:10.5px;font-weight:700;width:17px;height:17px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff}
.rl.o{background:var(--ok)} .rl.x{background:var(--bad)}
.btn.del{background:transparent;color:var(--bad);border:1px solid #efc4bf}
.nact .btn.del{margin-left:auto}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,20,20,.35);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal .card{max-width:380px}
.modal p{margin:0 0 16px}
.row{display:flex;gap:10px;justify-content:flex-end}
.tabs{display:flex;gap:6px;margin:-8px 0 20px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto}
.tab .cnt.bmc{background:#c9a227}
.star{flex:0 0 auto;margin-left:8px;border:0;background:transparent;font-size:24px;line-height:1;color:#b9b2a3;cursor:pointer;padding:0 2px;-webkit-tap-highlight-color:transparent}
.star.on{color:#d9a400}
.qhead .stem{flex:1}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(10px);background:rgba(31,35,40,.92);color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:all .2s;z-index:20}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.tab{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500;font-size:14px;color:var(--muted)}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab .cnt{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px}
.nhead{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.nhead .sp{flex:1}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:#c5d6e8;color:var(--accent);font-weight:700}
.nstats{font-size:14px;color:var(--muted)}
.nmeta{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:6px 0 0}
.nmeta .pill{background:#f1ede4;border-radius:999px;padding:1px 9px}
.nmeta .pill.hot{background:var(--bad-soft);color:var(--bad);font-weight:700}
.q.mastered{opacity:.6}
.nact{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.nact .btn{padding:7px 12px;font-size:13px}
textarea.memo{width:100%;min-height:54px;margin-top:10px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:14px;background:#fffef9;resize:vertical}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.saved{font-size:13px;color:var(--ok);margin-top:8px}
.notice{font-size:13px;color:var(--muted);margin:0 0 12px}
body{word-break:keep-all;overflow-wrap:anywhere;-webkit-text-size-adjust:100%}
.bar .in{padding-bottom:max(10px, env(safe-area-inset-bottom))}
.opt,.tab,.chip,.btn{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@media (max-width:560px){
  .tab{padding:7px 11px;font-size:13.5px}
  .qhead .star{margin-left:auto}
  .wrap{padding:16px 12px 110px}
  header.top{margin-bottom:16px}
  .q{padding:16px 14px 12px;border-radius:12px}
  .qhead{gap:6px}
  .qnum{min-width:auto;font-size:17px}
  .box{padding:10px 12px;font-size:14.5px}
  .opt{padding:10px 8px;gap:8px}
  .bar .in{padding:8px 12px;gap:10px;flex-wrap:nowrap;padding-bottom:max(8px, env(safe-area-inset-bottom))}
  .timer{font-size:17px}
  .omr{flex-wrap:nowrap;overflow-x:auto;min-width:0;scrollbar-width:none;padding:2px 0}
  .omr::-webkit-scrollbar{display:none}
  .omr a{flex:0 0 28px;height:28px}
  .bar .btn{padding:9px 14px}
  .card{padding:18px 16px}
  .ubar{grid-template-columns:78px 1fr 44px}
  .tools .btn{flex:1;white-space:nowrap}
  .tools .toggle{flex-basis:100%}
}
@media (max-width:560px){.nmeta{margin-left:0}h1{font-size:22px}.qmeta{display:none}.score .big{font-size:36px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="kicker">교육청 시설관리 · 사회 25문항</div>
      <h1>사회 실전 모의고사</h1>
    </div>
    <label>회차 <select id="roundSel"></select></label>
  </header>
  <nav class="tabs">
    <button class="tab" data-v="today">오늘의 문제 <span class="cnt hide" id="tcnt">1</span></button>
    <button class="tab on" data-v="exam">모의고사</button>
    <button class="tab" data-v="notes">오답노트 <span class="cnt hide" id="ncnt"></span></button>
    <button class="tab" data-v="ox">OX 퀴즈</button>
    <button class="tab" data-v="bm">북마크 <span class="cnt bmc hide" id="bcnt"></span></button>
  </nav>

  <section id="notes" class="hide"></section>
  <section id="today" class="hide"></section>
  <section id="bm" class="hide"></section>
  <section id="ox" class="hide"></section>
  <section id="intro" class="card intro"></section>
  <section id="result" class="card result hide"></section>
  <section id="exam" class="hide"></section>
</div>

<div class="bar hide" id="bar"><div class="in">
  <span class="timer" id="timer">25:00</span>
  <div class="omr" id="omr"></div>
  <button class="btn" id="submitBtn">제출</button>
</div></div>

<div class="modal hide" id="modal"><div class="card">
  <p id="modalMsg"></p>
  <div class="row"><button class="btn ghost" id="mCancel">계속 풀기</button><button class="btn" id="mOk">제출하기</button></div>
</div></div>

<script>

: "GDP는 '어디서' 만들었는지(국경), GNP는 '누가' 만들었는지(국적)를 기준으로 한다. 그래서 외국인이 국내에서 생산한 것은 GDP에만, 자국민이 해외에서 생산한 것은 GNP에만 들어간다. 해외 투자가 많은 선진국은 대체로 GNP > GDP, 외국 기업을 유치하는 개발 도상국은 GDP > GNP가 된다. 세계화로 기업이 국경을 넘나들면서 국내 고용·경기 사정을 더 잘 보여 주는 GDP가 주로 쓰인다.", "trap": ["외국인의 국내 생산 = GDP O, GNP X", "폐쇄 경제에서만 GDP = GNP"], "tip": "GDP = 어디서(국경), GNP = 누가(국적)", "cmp": [["생산 주체·장소", "GDP", "GNP"], ["자국민·국내", "O", "O"], ["외국인·국내", "O", "X"], ["자국민·해외", "X", "O"]]}}, {"unit": "경제", "topic": "명목 GDP와 실질 GDP", "stem": "표는 갑국의 명목 GDP와 GDP 디플레이터를 나타낸 것이다. 이에 대한 설명으로 옳은 것은? (단, 기준 연도는 2024년이다.)", "box": "구분 │ 2024년 │ 2025년\n명목 GDP │ 200조 원 │ 220조 원\nGDP 디플레이터 │ 100 │ 110", "opts": ["2025년의 실질 GDP는 2024년과 같다.", "2024년에는 명목 GDP가 실질 GDP보다 크다.", "2025년의 경제 성장률은 10%이다.", "2025년의 명목 GDP 증가는 생산량 증가 때문이다."], "why": ["실질 GDP = 명목 GDP ÷ 디플레이터 × 100. 2025년 = 220 ÷ 110 × 100 = 200조 원으로 2024년(200조 원)과 같다.", "기준 연도에는 명목 GDP와 실질 GDP가 같다.", "경제 성장률은 실질 GDP 증가율이다. 실질 GDP가 변하지 않았으므로 0%.", "명목 GDP 10% 증가는 전부 물가(디플레이터 10% 상승) 때문이다."], "ans": 0, "sum": {"freq": "★★★ (2014, 2017~2019 다수)", "intent": "명목 GDP·실질 GDP·GDP 디플레이터의 관계로 경제 성장률과 물가 상승률을 계산하는가.", "concept": "명목 GDP는 그해 가격으로 계산하므로 생산이 그대로여도 물가가 오르면 커진다. 그래서 진짜 생산 증가를 보려면 기준 연도 가격으로 계산한 실질 GDP를 봐야 한다. GDP 디플레이터 = 명목 GDP ÷ 실질 GDP × 100이고, 기준 연도에는 100이다. 경제 성장률은 실질 GDP 증가율이며, 대략 '명목 GDP 증가율 − 물가 상승률'로 구할 수 있다.", "trap": ["경제 성장률 = 명목 GDP 증가율 X → 실질 GDP 증가율", "기준 연도: 명목 = 실질, 디플레이터 = 100"], "tip": "실질 GDP = 명목 ÷ 디플레이터 × 100 / 성장률 ≈ 명목 증가율 − 물가 상승률", "cmp": []}}, {"unit": "경제", "topic": "경기 안정화 정책", "stem": "다음 상황에서 갑국 정부와 중앙은행이 실시할 정책으로 적절한 것만을 <보기>에서 고르면?", "box": "갑국은 경기 과열로 물가가 빠르게 오르고 있다.\n<보기>\nㄱ. 소득세율 인상\nㄴ. 정부 지출 확대\nㄷ. 국·공채 매각\nㄹ. 지급 준비율 인하", "opts": ["ㄷ, ㄹ", "ㄱ, ㄷ", "ㄴ, ㄹ", "ㄱ, ㄴ"], "why": ["지급 준비율 인하(ㄹ)는 통화량을 늘리는 확장 정책이다.", "경기 과열·물가 상승에는 총수요를 줄여야 한다. 세율 인상(ㄱ)과 국·공채 매각(ㄷ, 통화량 흡수)이 적절하다.", "둘 다 경기 침체기에 쓰는 확장 정책이다.", "정부 지출 확대(ㄴ)는 총수요를 늘려 물가를 더 올린다."], "ans": 1, "sum": {"freq": "★★★ (2013~2020 매년)", "intent": "경기 상황에 맞는 재정 정책(세율·지출)과 통화 정책(재할인율·지급 준비율·공개 시장 조작)의 방향을 /* ───── 오답노트 저장소: db(영구) 우선, 안 되면 이 브라우저에 저장 ───── */
const NB = { mode:"local", status:"loading", db:null, items:{} };
const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
function nbLocalLoad(){ NB.items = store.get("socexam-wrong") || {}; }
function nbLocalSave(){ store.set("socexam-wrong", NB.items); }
async function nbInit(){
  nbLocalLoad(); nbChanged();
  let db = null;
  try{ if(typeof claude !== "undefined" && claude.use) db = await claude.use("db"); }catch(e){ db = null; }
  if(!db){ NB.status = "local"; nbChanged(); return; }
  NB.db = db; NB.mode = "db";
  const t = setTimeout(()=>{ NB.status = "slow"; nbChanged(); }, 10000);
  db.collection("wrong").onSnapshot(snap=>{
    if(!snap.metadata.fromCache){ clearTimeout(t); NB.status = "ok"; }
    const it = {}; snap.docs.forEach(d=>{ it[d.id] = d.data(); }); NB.items = it; nbChanged();
  }, err=>{
    clearTimeout(t); NB.db = null; NB.mode = "local"; NB.status = "local"; nbLocalLoad(); nbChanged();
  });
}
async function nbPut(key, obj){
  NB.items = {...NB.items, [key]: obj};
  if(NB.mode === "db" && NB.db){
    try{ await NB.db.doc("wrong/"+key).set(obj); }
    catch(e){
      if(e && e.code === "quota_exceeded"){ NB.status = "full"; }
      else { NB.mode = "local"; NB.status = "local"; nbLocalSave(); }
    }
  } else nbLocalSave();
  nbChanged();
}
async function nbDel(key){
  const it = {...NB.items}; delete it[key]; NB.items = it;
  if(NB.mode === "db" && NB.db){
    try{ await NB.db.doc("wrong/"+key).delete(); }
    catch(e){ NB.mode = "local"; NB.status = "local"; nbLocalSave(); }
  } else nbLocalSave();
  nbChanged();
}
let askCb = null;
function ask(msg, okLabel, cb){
  $("#modalMsg").textContent = msg; $("#mOk").textContent = okLabel; $("#mCancel").textContent = "취소";
  askCb = cb; $("#modal").classList.remove("hide");
}
async function nbAttempt(rec){
  if(NB.mode === "db" && NB.db){ try{ await NB.db.collection("attempts").add(rec); }catch(e){} }
}
function nbChanged(){
  const open = Object.values(NB.items).filter(x=>!x.mastered).length;
  const c = $("#ncnt"); if(c){ c.textContent = open; c.classList.toggle("hide", !open); }
  if(view === "notes") renderNotes();
  if(view === "today") renderToday();
}

자가 법정 대리인의 동의 없이 한 계약은 처음부터 무효이다.", "o": false, "e": "무효가 아니라 '취소할 수 있는' 행위이며, 취소 전까지는 유효하다."}, {"id": "ox14", "unit": "정치와 법", "topic": "미성년자의 법률 행위", "s": "미성년자가 속임수로 상대방이 자신을 성년자로 믿게 하여 계약했다면 그 계약을 취소할 수 없다.", "o": true, "e": "제한 능력자가 속임수를 쓴 경우에는 취소권이 배제된다."}, {"id": "ox15", "unit": "정치와 법", "topic": "미성년자의 법률 행위", "s": "미성년자와 계약한 상대방은 계약 당시 미성년자임을 알았더라도 계약을 철회할 수 있다.", "o": false, "e": "상대방의 철회권은 계약 당시 미성년자임을 몰랐을 때(선의)에만 인정된다."}, {"id": "ox16", "unit": "정치와 법", "topic": "특수 불법 행위", "s": "사용자 책임에서 사용자가 피용자의 선임·감독에 상당한 주의를 다했음을 증명하면 배상 책임을 면한다.", "o": true, "e": "사용자 책임은 중간 책임(입증 책임 전환)이다. 사용자가 배상하면 피용자에게 구상권을 행사할 수 있다."}, {"id": "ox17", "unit": "정치와 법", "topic": "범죄의 성립 요건", "s": "정당방위는 책임 조각 사유이다.", "o": false, "e": "정당방위·긴급피난·정당행위·자구행위·피해자의 승낙은 위법성 조각 사유이다."}, {"id": "ox18", "unit": "정치와 법", "topic": "범죄의 성립 요건", "s": "만 14세 미만인 형사 미성년자의 행위는 책임이 조각되어 범죄가 성립하지 않는다.", "o": true, "e": "구성 요건 해당성과 위법성은 있지만 책임이 조각된다."}, {"id": "ox19", "unit": "정치와 법", "topic": "범죄의 성립 요건", "s": "심신 미약자의 행위는 책임이 조각되어 처벌되지 않는다.", "o": false, "e": "책임이 조각되는 것은 심신 상실자이다. 심신 미약자는 형을 감경할 수 있다."}, {"id": "ox20", "unit": "정치와 법", "topic": "형사 절차", "s": "보석은 기소 전 피의자 단계에서도 청구할 수 있다.", "o": false, "e": "보석은 기소된 피고인에게 인정된다. 피의자는 구속 적부 심사를 청구할 수 있다."}, {"id": "ox21", "unit": "정치와 법", "topic": "형사 절차", "s": "구속된 피의자는 법원에 구속 적부 심사를 청구할 수 있다.", "o": true, "e": "구속 적부 심사는 수사 단계의 피의자를 위한 인권 보호 제도이다."}, {"id": "ox22", "unit": "정치와 법", "topic": "형사 절차", "s": "국민 참여 재판에서 배심원의 평결은 판사를 구속한다.", "o": false, "e": "배심원의 평결은 권고적 효력만 있어 판사를 구속하지 않는다."}, {"id": "ox23", "unit": "경제", "topic": "기회비용", "s": "기회비용은 명시적 비용과 암묵적 비용의 합이다.", "o": true, "e": "명시적 비용: 실제 지출한 비용 / 암묵적 비용: 포기한 대안 중 가장 큰 가치."}, {"id": "ox24", "unit": "경제", "topic": "기회비용", "s": "합리적 선택은 편익이 기회비용보다 큰(순편익이 양수인) 대안을 고르는 것이다.", "o": true, "e": "여러 대안 중 순편익이 가장 큰 것을 고르면, 그 선택의 편익은 기회비용보다 크다."}, {"id": "ox25", "unit": "경제", "topic": "기회비용", "s": "이미 지출되어 회수할 수 없는 매몰 비용도 합리적 선택 시 고려해야 한다.", "o": false, "e": "매몰 비용은 회수할 수 없으므로 합리적 선택에서 고려하지 않는다."},  "topic": "국민 소득", "s": "국내에서 일하는 외국인 근로자의 생산도 우리나라 GDP에 포함된다.", "o": true, "e": "GDP는 국적과 관계없이 한 나라 안에서 생산된 최종 생산물의 시장 가치이다."}, {"id": "ox40", "unit": "경제", "topic": "국민 소득", "s": "주부의 가사 노동은 GDP에 포함된다.", "o": false, "e": "시장에서 거래되지 않는 가사 노동, 중고품 거래(중개 수수료 제외), 주식 시세 차익은 GDP에 포함되지 않는다."}, {"id": "ox41", "unit": "경제", "topic": "인플레이션", "s": "예상치 못한 인플레이션이 발생하면 채권자가 채무자보다 유리해진다.", "o": false, "e": "화폐 가치가 떨어져 채무자가 유리하고, 채권자·고정 소득자는 불리해진다."}, {"id": "ox42", "unit": "경제", "topic": "인플레이션", "s": "인플레이션이 발생하면 실물 자산 보유자가 화폐 자산 보유자보다 유리해진다.", "o": true, "e": "실물 자산의 가치는 물가와 함께 오르는 경향이 있다."}, {"id": "ox43", "unit": "경제", "topic": "환율", "s": "원/달러 환율이 상승하면 원화의 가치는 하락한다.", "o": true, "e": "1달러를 사는 데 더 많은 원화가 필요해진 것이므로 원화 가치 하락(평가 절하)이다."}, {"id": "ox44", "unit": "경제", "topic": "환율", "s": "원/달러 환율이 상승하면 미국 여행 경비 부담이 줄어든다.", "o": false, "e": "달러를 사는 데 원화가 더 들어 여행 경비 부담이 커진다. 대신 수출에는 유리하다."}, {"id": "ox45", "unit": "사회·문화", "topic": "사회·문화 현상", "s": "사회·문화 현상은 인간의 가치가 개입된 가치 함축적 현상이다.", "o": true, "e": "자연 현상은 몰가치적, 사회·문화 현상은 가치 함축적이다."}, {"id": "ox46", "unit": "사회·문화", "topic": "사회·문화 현상", "s": "사회·문화 현상에는 인과 관계가 필연적으로 나타나는 법칙이 적용된다.", "o": false, "e": "사회·문화 현상에는 확률의 원리가 적용된다. 필연적 인과 관계는 자연 현상의 특징이다."}, {"id": "ox47", "unit": "사회·문화", "topic": "기능론과 갈등론", "s": "기능론은 사회 구성 요소들이 상호 의존적으로 사회 유지에 기여한다고 본다.", "o": true, "e": "기능론은 사회를 유기체에 비유하고 합의된 가치와 사회 통합을 강조한다."}, {"id": "ox48", "unit": "사회·문화", "topic": "기능론과 갈등론", "s": "갈등론은 사회 변동을 일시적이고 비정상적인 현상으로 본다.", "o": false, "e": "변동을 일시적 불균형으로 보는 것은 기능론이다. 갈등론은 갈등과 변동을 보편적 현상으로 본다."}, {"id": "ox49", "unit": "사회·문화", "topic": "기능론과 갈등론", "s": "갈등론은 교육이 기존의 불평등한 계층 구조를 재생산한다고 본다.", "o": true, "e": "갈등론은 교육이 지배 집단의 이익과 가치를 정당화한다고 본다."}, {"id": "ox50", "unit": "사회·문화", "topic": "연구 방법", "s": "양적 연구는 계량화된 자료를 통계적으로 분석하여 일반화를 추구한다.", "o": true, "e": "양적 연구: 가설 검증, 객관적 측정, 일반화 용이."}, {"id": "ox51", "unit": "사회·문화", "topic": "연구 방법", "s": "질적 연구는 양적 연구보다 연구 결과를 일반화하기에 유리하다.", "o": false, "e": "질적 연구는 소수 사례를 심층 이해하므로 일반화가 어렵다."}, {"id": "ox52 }, {"id": "ox65", "unit": "사회·문화", "topic": "문화 변동", "s": "문화 지체는 비물질문화가 물질문화의 변동 속도를 따라가지 못하는 현상이다.", "o": true, "e": "예: 스마트폰은 빠르게 보급됐지만 사용 예절이 이를 따라가지 못하는 현상."}, {"id": "ox66", "unit": "사회·문화", "topic": "문화 이해 태도", "s": "문화 상대주의는 각 문화를 그 사회의 맥락에서 이해하려는 태도이다.", "o": true, "e": "단, 보편적 가치를 훼손하는 문화까지 인정하는 극단적 문화 상대주의는 경계해야 한다."}, {"id": "ox67", "unit": "사회·문화", "topic": "문화 이해 태도", "s": "자문화 중심주의는 다른 문화를 자기 문화보다 우월하다고 여기는 태도이다.", "o": false, "e": "다른 문화를 더 우월하게 여기는 것은 문화 사대주의이다. 자문화 중심주의는 자기 문화를 우월하다고 여긴다."}];
const OXS = { mode:"local", db:null, st:{} };   // st[id] = {r, w, last, lastOk, log:[1/0...]}
function oxLocalLoad(){ OXS.st = store.get("socexam-ox") || {}; }
function oxLocalSave(){ store.set("socexam-ox", OXS.st); }
async function oxInit(){
  oxLocalLoad();
  let db = null;
  try{ if(typeof claude !== "undefined" && claude.use) db = await claude.use("db"); }catch(e){ db = null; }
  if(!db) return;
  OXS.db = db; OXS.mode = "db";
  db.collection("ox").onSnapshot(snap=>{
    const st = {}; snap.docs.forEach(d=>{ st[d.id] = d.data(); }); OXS.st = st;
    if(view === "ox") renderOX();
  }, ()=>{ OXS.db = null; OXS.mode = "local"; oxLocalLoad(); });
}
async function oxRecord(id, ok){
  const cur = OXS.st[id] || {r:0, w:0, log:[]};
  const nx = {r:(cur.r||0)+(ok?1:0), w:(cur.w||0)+(ok?0:1), last: today(), lastOk: ok, log:[...(cur.log||[]), ok?1:0].slice(-20)};
  OXS.st = {...OXS.st, [id]: nx};
  if(OXS.mode==="db" && OXS.db){ try{ await OXS.db.doc("ox/"+id).set(nx); }catch(e){ OXS.mode="local"; oxLocalSave(); } }
  else oxLocalSave();
}
const OXB = { mode:"local", db:null, items:{} };
function oxbLocalLoad(){ OXB.items = store.get("socexam-oxbm") || {}; }
function oxbLocalSave(){ store.set("socexam-oxbm", OXB.items); }
async function oxbInit(){
  oxbLocalLoad(); bmChanged();
  let db = null;
  try{ if(typeof claude !== "undefined" && claude.use) db = await claude.use("db"); }catch(e){ db = null; }
  if(!db) return;
  OXB.db = db; OXB.mode = "db";
  db.collection("oxbm").onSnapshot(snap=>{
    const it = {}; snap.docs.forEach(d=>{ it[d.id] = d.data(); }); OXB.items = it; bmChanged();
  }, ()=>{ OXB.db = null; OXB.mode = "local"; oxbLocalLoad(); bmChanged(); });
}
async function oxbToggle(id){
  const on = !!OXB.items[id];
  if(on){
    const it = {...OXB.items}; delete it[id]; OXB.items = it; bmChanged();
    if(OXB.mode==="db" && OXB.db){ try{ await OXB.db.doc("oxbm/"+id).delete(); }catch(e){ OXB.mode="local"; oxbLocalSave(); } } else oxbLocalSave();
  } else {
    const obj = {id, addedAt: today(), at: new Date().toISOString()};
    OXB.items = {...OXB.items, [id]: obj}; bmChanged();
    if(OXB.mode==="db" && OXB.db){ try{ await OXB.db.doc("oxbm/"+id).set(obj); }catch(e){ OXB.mode="local"; oxbLocalSave(); } } else oxbLocalSave();
  }
}
function oxStar(id){
  const on = !!OXB.items[id];
  return `<button class="star ${on?"on":""}" data-oxbm="${id}" aria-label="${on?"북마크 해제":"북마크"}">${on?"★":"☆"}</button>`;
}
let ox = null, oxUnit = "전체", oxOnlyWeak = false, oxOnlyBm = false;
function oxPool(){
  return OXQ.filter(x => oxUnit==="전체" || x.unit===oxUnit)
            .filter(x => !oxOnlyWeak || (OXS.st[x.id] && OXS.st[x.id].lastOk === false))
            .filter(x => !oxOnlyBm || OXB.items[x.id]);
}
function oxNewSession(){ ox = {hist:[], ans:[], pos:-1, bag:[], right:0, wrong:0}; oxAdvance(); }
function oxDraw(){
  const pool = oxPool().map(x=>x.id); if(!pool.length) return null;
  if(!ox.bag.length){
    const b = pool.slice();
    for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; }
    const last = ox.hist[ox.hist.length-1];
    if(b.length>1 && b[b.length-1]===last) [b[0],b[b.length-1]]=[b[b.length-1],b[0]];
    ox.bag = b;
  }
  return ox.bag.pop();
}
function oxAdvance(){
  if(ox.pos < ox.hist.length-1){ ox.pos++; return true; }
  const id = oxDraw(); if(!id) return false;
  ox.hist.push(id); ox.ans.push(null); ox.pos = ox.hist.length-1; return true;
}
function oxDots(st){
  const log = (st && st.log) || []; if(!log.length) return "";
  return `<span class="rlog">${log.slice(-10).map(v=>`<i class="rl ${v?"o":"x"}">${v?"O":"X"}</i>`).join("")}</span>`;
}
function renderOX(){
  const el = $("#ox");
  if(!ox) oxNewSession();
  const units = ["전체","정치와 법","경제","사회·문화"];
  const weak = OXQ.filter(x=>OXS.st[x.id] && OXS.st[x.id].lastOk===false).length;
  const seen = OXQ.filter(x=>OXS.st[x.id]).length;
  const tr = OXQ.reduce((a,x)=>a+((OXS.st[x.id]||{}).r||0),0), tw = OXQ.reduce((a,x)=>a+((OXS.st[x.id]||{}).w||0),0);
  const head = `
    <div class="filters" style="margin-bottom:10px">${units.map(u=>`<button class="chip ${u===oxUnit?"on":""}" data-ou="${u}">${u}</button>`).join("")}</div>
    <div class="nhead">
      <label class="toggle"><input type="checkbox" id="oxWeak" ${oxOnlyWeak?"checked":""}> 최근에 틀린 문장만 (${weak})</label>
      <label class="toggle"><input type="checkbox" id="oxBmOnly" ${oxOnlyBm?"checked":""}> ★ 북마크만 (${Object.keys(OXB.items).length})</label>
      <span class="sp"></span>
      <span class="nstats">이번에 <b>${ox.right+ox.wrong}</b>문장 · 맞힘 ${ox.right} · 틀림 ${ox.wrong}</span>
    </div>
    <p class="notice" style="margin:-4px 0 12px">전체 ${OXQ.length}문장 중 ${seen}문장 풀어 봄 · 누적 정답률 ${tr+tw?Math.round(tr/(tr+tw)*100):0}%</p>`;
  const bindHead = ()=>{
    document.querySelectorAll("[data-ou]").forEach(b=>b.onclick=()=>{ oxUnit=b.dataset.ou; ox=null; renderOX(); });
    $("#oxWeak").onchange = e => { oxOnlyWeak = e.target.checked; ox=null; renderOX(); };
    $("#oxBmOnly").onchange = e => { oxOnlyBm = e.target.checked; ox=null; renderOX(); };
  };
  if(ox.pos < 0){
    el.innerHTML = head + `<div class="card empty">${oxOnlyBm?"북마크한 문장이 없어요. 문장 오른쪽 위 ☆를 눌러 저장해 보세요.":oxOnlyWeak?"최근에 틀린 문장이 없어요. 잘하고 있어요!":"이 단원에 문장이 없어요."}</div>`;
    bindHead(); return;
  }
  const id = ox.hist[ox.pos], x = OXQ.find(o=>o.id===id), a = ox.ans[ox.pos], done = a!=null, ok = done && a===x.o;
  const st = OXS.st[x.id], n = st ? (st.r||0)+(st.w||0) : 0;
  el.innerHTML = head + `
    <div class="slider"><div class="slide ${slideClass()}" id="oxSlide">
      <article class="q oxcard ${done?(ok?"correct":"wrong"):""}">
        <div class="qhead"><span class="nstats"><span class="dot" style="background:${UNIT_COLOR[x.unit]}"></span>${x.unit} · ${esc(x.topic)}</span><span style="flex:1"></span>${oxStar(x.id)}</div>
        <div class="nmeta" style="margin-top:8px">
          <span class="pill ${st&&st.w>st.r?"hot":""}">${n?`푼 횟수 ${n}회 · 맞힘 ${st.r||0} · 틀림 ${st.w||0}`:"처음 푸는 문장"}</span>
          ${oxDots(st)}
        </div>
        <p class="oxs">${esc(x.s)}</p>
        <div class="oxbtns">
          <button class="oxb o ${done&&x.o?"is-ans":""} ${done&&a===true&&!x.o?"is-wrong":""}" data-ox="1" ${done?"disabled":""}>O</button>
          <button class="oxb x ${done&&!x.o?"is-ans":""} ${done&&a===false&&x.o?"is-wrong":""}" data-ox="0" ${done?"disabled":""}>X</button>
        </div>
        ${done?`<p class="saved" style="color:${ok?"var(--ok)":"var(--bad)"};font-weight:700;font-size:16px">${ok?"정답이에요!":"틀렸어요."} 정답은 ${x.o?"O":"X"}</p>
          <p class="oxexp">${esc(x.e)}</p>`:""}
      </article>
    </div></div>
    <button class="btn oxrand ${done?"":"ghost"}" id="oxRand">🔀 ${done?"랜덤 문제":"다른 문제로 바꾸기"}</button>`;
  bindHead();
  const goNext = ()=>{ if(oxAdvance()){ slideDir=1; renderOX(); } };
  $("#oxRand").onclick = ()=>{ $("#oxSlide").classList.add("out-next"); setTimeout(goNext,170); };
  if(!done){
    document.querySelectorAll("[data-ox]").forEach(b=>b.onclick=()=>{
      const pick = b.dataset.ox==="1"; ox.ans[ox.pos] = pick; const good = pick===x.o;
      if(good) ox.right++; else ox.wrong++;
      oxRecord(x.id, good); renderOX();
    });
  }
}

const BM = { mode:"local", db:null, items:{} };
function bmLocalLoad(){ BM.items = store.get("socexam-bm") || {}; }
function bmLocalSave(){ store.set("socexam-bm", BM.items); }
async function bmInit(){
  bmLocalLoad(); bmChanged();
  let db = null;
  try{ if(typeof claude !== "undefined" && claude.use) db = await claude.use("db"); }catch(e){ db = null; }
  if(!db) return;
  BM.db = db; BM.mode = "db";
  db.collection("bookmarks").onSnapshot(snap=>{
    const it = {}; snap.docs.forEach(d=>{ it[d.id] = d.data(); }); BM.items = it; bmChanged();
  }, ()=>{ BM.db = null; BM.mode = "local"; bmLocalLoad(); bmChanged(); });
}
function qData(round, qno){
  const r = ROUNDS.find(x=>x.round===round); const q = r && r.questions[qno-1];
  if(q) return {round, qno, title:r.title, unit:q.unit, topic:q.topic, stem:q.stem, box:q.box, opts:q.opts, why:q.why, ans:q.ans, sum:q.sum||null};
  const n = NB.items[`r${round}-q${qno}`] || BM.items[`r${round}-q${qno}`];
  return n ? {round, qno, title:n.title, unit:n.unit, topic:n.topic, stem:n.stem, box:n.box, opts:n.opts, why:n.why, ans:n.ans} : null;
}
async function bmToggle(round, qno){
  const key = `r${round}-q${qno}`, on = !!BM.items[key];
  if(on){
    const it = {...BM.items}; delete it[key]; BM.items = it; bmChanged();
    if(BM.mode==="db" && BM.db){ try{ await BM.db.doc("bookmarks/"+key).delete(); }catch(e){ BM.mode="local"; bmLocalSave(); } } else bmLocalSave();
  } else {
    const d = qData(round, qno); if(!d) return;
    const obj = {...d, addedAt: today(), at: new Date().toISOString()};
    BM.items = {...BM.items, [key]: obj}; bmChanged();
    if(BM.mode==="db" && BM.db){ try{ await BM.db.doc("bookmarks/"+key).set(obj); }catch(e){ BM.mode="local"; bmLocalSave(); } } else bmLocalSave();
  }
}
function starBtn(round, qno){
  const on = !!BM.items[`r${round}-q${qno}`];
  return `<button class="star ${on?"on":""}" data-bm="${round}:${qno}" aria-label="${on?"북마크 해제":"북마크"}" title="${on?"북마크 해제":"북마크에 저장"}">${on?"★":"☆"}</button>`;
}
document.addEventListener("click", e=>{
  const ob = e.target.closest("[data-oxbm]");
  if(ob){
    e.preventDefault(); e.stopPropagation();
    const willOn = !ob.classList.contains("on");
    oxbToggle(ob.dataset.oxbm);
    toast(willOn ? "OX 문장을 북마크했어요" : "북마크에서 뺐어요");
    return;
  }
  const b = e.target.closest("[data-bm]"); if(!b) return;
  e.preventDefault(); e.stopPropagation();
  const [r, q] = b.dataset.bm.split(":").map(Number);
  const willOn = !b.classList.contains("on");
  bmToggle(r, q);
  toast(willOn ? "북마크에 저장했어요" : "북마크에서 뺐어요");
}, true);
let toastT = null;
function toast(msg){
  let t = $("#toast"); if(!t){ t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("show"), 1400);
}
function bmChanged(){
  const n = Object.keys(BM.items).length + Object.keys((typeof OXB!=="undefined"?OXB.items:{})).length, c = $("#bcnt");

function dayNum(dstr){ const [y,m,d] = dstr.split("-").map(Number); return Math.floor(Date.UTC(y,m-1,d)/86400000); }
function dstrOf(n){ const d = new Date(n*86400000); return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`; }
function seededShuffle(arr, seed){
  const a = arr.slice(); let x = seed >>> 0 || 1;
  const rnd = () => { x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; };
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
// 모든 회차의 문제를 날짜 기준으로 섞어, 한 바퀴 돌 때까지 겹치지 않게 하루 1문제
function dailyPick(dstr){
  const all = []; ROUNDS.forEach((r,ri)=>r.questions.forEach((q,qi)=>all.push([ri,qi])));
  const n = dayNum(dstr), cycle = Math.floor(n / all.length);
  const order = seededShuffle(all, 7919 * (cycle + 1));
  const [ri, qi] = order[n % all.length];
  return {ri, qi, r: ROUNDS[ri], q: ROUNDS[ri].questions[qi]};
}

}

function attachSwipe(el, onNext, onPrev){
  if(!el) return;
  let x0=0, y0=0, dx=0, drag=false, lock=null;
  el.addEventListener("touchstart", e=>{
    if(e.target.closest("textarea,input,button,summary")) { drag=false; return; }
    const t=e.touches[0]; x0=t.clientX; y0=t.clientY; dx=0; drag=true; lock=null; el.classList.remove("snap");
  }, {passive:true});
  el.addEventListener("touchmove", e=>{
    if(!drag) return;
    const t=e.touches[0]; dx=t.clientX-x0; const dy=t.clientY-y0;
    if(lock===null && (Math.abs(dx)>8 || Math.abs(dy)>8)) lock = Math.abs(dx)>Math.abs(dy) ? "x" : "y";
    if(lock!=="x") return;
    const can = dx<0 ? !!onNext : !!onPrev;
    el.style.transform = `translateX(${can?dx:dx*0.25}px)`;
  }, {passive:true});
  el.addEventListener("touchend", ()=>{
    if(!drag) return; drag=false;
    if(lock==="x" && dx<-60 && onNext){ el.style.transform=""; el.classList.add("out-next"); setTimeout(onNext,170); }
    else if(lock==="x" && dx>60 && onPrev){ el.style.transform=""; el.classList.add("out-prev"); setTimeout(onPrev,170); }
    else { el.classList.add("snap"); el.style.transform=""; }
  });
}

async function nbRecordTry(key, ok){
  const ex = NB.items[key]; if(!ex) return;
  const x = {...ex};
  x.retryCount = (x.retryCount||0) + 1;
  if(ok) x.retryRight = (x.retryRight||0) + 1; else x.retryWrong = (x.retryWrong||0) + 1;
  x.lastRetry = today();
  x.retryLog = [...(x.retryLog||[]), {d: today(), ok: !!ok}].slice(-30);
  await nbPut(key, x);
}
function retryPills(x){
  if(!x.retryCount) return `<span class="pill">다시 푼 적 없음</span>`;
  const log = (x.retryLog||[]).slice(-10).map(r=>`<i class="rl ${r.ok?"o":"x"}" title="${esc(r.d)}">${r.ok?"O":"X"}</i>`).join("");
  return `<span class="pill">다시 푼 횟수 ${x.retryCount}회 · 맞힘 ${x.retryRight||0} · 틀림 ${x.retryWrong||0}</span>
    <span class="pill">최근 다시 풀기 ${esc(x.lastRetry||"")}</span>
    ${log?`<span class="rlog">${log}</span>`:""}`;
}

/* ───── 랜덤 다시 풀기 ───── */
let drill = null;
function noteFilter(all){
  return all.filter(x => nUnit==="전체" || x.unit===nUnit).filter(x => !(hideMastered && x.mastered));
}
function startDrill(keys){
  const q = keys.slice();
  for(let i=q.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [q[i],q[j]]=[q[j],q[i]]; }
  drill = {queue:q, idx:0, pick:null, checked:false, right:0, wrong:0, wrongKeys:[]};
  renderNotes(); window.scrollTo(0,0);
}
function exitDrill(){ drill = null; slideDir = null; renderNotes(); window.scrollTo(0,0); }
function renderDrill(){
  const d = drill, total = d.queue.length;
  if(d.idx >= total){
    $("#notes").innerHTML = `<div class="card">
      <h2 style="font-family:'Noto Serif KR',serif;margin:0 0 6px">랜덤 다시 풀기 끝!</h2>
      <div class="score"><span class="big">${d.right} / ${total}</span><span class="sub">맞힘 ${d.right} · 틀림 ${d.wrong}</span></div>
      <div class="tools">
        ${d.wrongKeys.length?`<button class="btn" id="drWrong">틀린 ${d.wrongKeys.length}문항만 다시</button>`:""}
        <button class="btn ${d.wrongKeys.length?"ghost":""}" id="drAgain">처음부터 다시 섞어 풀기</button>
        <button class="btn ghost" id="drExit">오답노트로 돌아가기</button>
      </div></div>`;
    const keys = d.queue.slice(), wk = d.wrongKeys.slice();
    $("#drAgain").onclick = ()=>startDrill(keys.filter(k=>NB.items[k]));
    if($("#drWrong")) $("#drWrong").onclick = ()=>startDrill(wk.filter(k=>NB.items[k]));
    $("#drExit").onclick = exitDrill;
    return;
  }
  const key = d.queue[d.idx], x = NB.items[key];
  if(!x){ d.idx++; return renderDrill(); }
  const ok = d.checked && d.pick === x.ans;
  $("#notes").innerHTML = `
    <div class="nhead">
      <span class="nstats"><b>${d.idx+1}</b> / ${total} 문항 · 맞힘 ${d.right} · 틀림 ${d.wrong}</span>
      <span class="sp"></span>
      <button class="btn ghost" id="drQuit" style="padding:7px 12px;font-size:13px">그만하기</button>
    </div>
    <div class="track" style="margin-bottom:14px"><div class="fill" style="width:${d.idx/total*100}%;background:var(--accent)"></div></div>
    <div class="slider"><div class="slide ${slideClass()}" id="drSlide">
    <article class="q ${d.checked?(ok?"correct done":"wrong done"):""}">
      <div class="qhead"><span class="qnum" style="min-width:auto">${x.round}회 ${x.qno}번</span>
        <span class="qmeta" style="margin-left:auto"><span class="dot" style="background:${UNIT_COLOR[x.unit]}"></span>${x.unit} · ${esc(x.topic)}</span>${starBtn(x.round, x.qno)}</div>
      <div class="nmeta">${retryPills(x)}</div>
      <p class="stem" style="margin-top:10px">${esc(x.stem)}</p>
      ${x.box?`<div class="box">${esc(x.box)}</div>`:""}
      <ul class="opts">${x.opts.map((o,j)=>{
        let c="";
        if(!d.checked && d.pick===j) c="sel";
        if(d.checked && j===x.ans) c="is-ans";
        if(d.checked && d.pick===j && j!==x.ans) c="is-wrongpick";
        return `<li class="opt ${c}" data-dp="${j}"><span class="n">${CIRC[j]}</span><span>${esc(o)}</span></li>`;
      }).join("")}</ul>
      ${!d.checked?`<div class="nact"><button class="btn" id="drCheck" ${d.pick==null?"disabled":""}>제출하고 채점하기</button>${d.pick==null?'<span class="nstats">보기를 먼저 골라 주세요</span>':""}</div>`:`
        <p class="saved" style="color:${ok?"var(--ok)":"var(--bad)"};font-weight:700">${ok?"정답이에요!":"틀렸어요. 해설을 확인하세요."}</p>
        <details class="exp" open><summary>정답 ${CIRC[x.ans]} · 내 답 ${CIRC[d.pick]} — 선지별 해설</summary>
          <ol>${x.why.map((w,j)=>`<li class="${j===x.ans?"ans":""}"><span class="tag">${CIRC[j]}</span><span>${j===x.ans?"(O) ":"(X) "}${esc(w)}</span></li>`).join("")}</ol>
        </details>
        ${sumBox(x)}
        ${x.memo?`<p class="notice" style="margin:10px 0 0">내 메모: ${esc(x.memo)}</p>`:""}
        <div class="nact">
          <button class="btn" id="drNext">${d.idx+1<total?"다음 문제 →":"결과 보기"}</button>
          ${x.mastered?'<span class="nstats">복습 완료로 표시됨</span>':`<button class="btn ghost" id="drMaster">복습 완료로 표시</button>`}
        </div>`}
    </article></div></div>
    ${d.checked?'<p class="swipehint">화면을 왼쪽으로 밀면 다음 문제로 넘어가요</p>':""}`;
  $("#drQuit").onclick = exitDrill;
  if(!d.checked){
    document.querySelectorAll("[data-dp]").forEach(el=>el.onclick=()=>{ const j=+el.dataset.dp; d.pick = d.pick===j?null:j; renderDrill(); });
    const c = $("#drCheck");
    if(c) c.onclick = ()=>{
      if(d.pick==null) return;
      d.checked = true; const good = d.pick === x.ans;
      if(good) d.right++; else { d.wrong++; d.wrongKeys.push(key); }
      renderDrill();
      nbRecordTry(key, good);
    };
  } else {
    const goNext = ()=>{ d.idx++; d.pick=null; d.checked=false; slideDir=1; renderDrill(); window.scrollTo(0,0); };
    $("#drNext").onclick = ()=>{ const el=$("#drSlide"); el.classList.add("out-next"); setTimeout(goNext,170); };
    attachSwipe($("#drSlide"), goNext, null);
    const m = $("#drMaster");
    if(m) m.onclick = async()=>{ m.disabled=true; await nbPut(key, {...NB.items[key], mastered:true, masteredAt:today()}); };
  }
}

function renderNotes(){
  if(drill) return renderDrill();
  if(sumView) return renderSumSheet();
  const all = Object.entries(NB.items).map(([k,v])=>({key:k, ...v}));
  const list = all
    .filter(x => nUnit==="전체" || x.unit===nUnit)
    .filter(x => !(hideMastered && x.mastered))
    .sort((a,b)=> (b.wrongCount||0)-(a.wrongCount||0) || String(b.lastWrong).localeCompare(String(a.lastWrong)) || a.round-b.round || a.qno-b.qno);
  if(nIdx > list.length-1) nIdx = Math.max(0, list.length-1);
  const open = all.filter(x=>!x.mastered).length, done = all.length - open;
  const units = ["전체","정치와 법","경제","사회·문화"];
  const note = NB.status==="local" ? "이 브라우저에만 저장되고 있어요. 다른 기기나 브라우저에서는 보이지 않을 수 있어요."
    : NB.status==="slow" ? "저장소에 연결하는 중이에요. 표시된 내용이 최신이 아닐 수 있어요."
    : NB.status==="full" ? "저장 공간이 가득 차 새 오답을 저장하지 못했어요. 복습 완료한 문항을 정리해 주세요." : "";
  $("#notes").innerHTML = `
    <div class="nhead">
      <div class="filters">${units.map(u=>`<button class="chip ${u===nUnit?"on":""}" data-u="${u}">${u}</button>`).join("")}</div>
      <span class="sp"></span>
      <span class="nstats">복습할 문항 <b>${open}</b> · 복습 완료 ${done}</span>
    </div>
    <div class="nhead">
      <label class="toggle"><input type="checkbox" id="hideM" ${hideMastered?"checked":""}> 복습 완료 숨기기</label>
      <label class="toggle"><input type="checkbox" id="coverA" ${coverAns?"checked":""}> 정답 가리고 다시 풀기</label>
      <span class="sp"></span>
      ${list.length?`<button class="btn" id="drStart">랜덤 다시 풀기 (${list.length}문항)</button>`:""}
      ${all.length?`<button class="btn ghost" id="sumOpen">📄 요약 정리본</button>`:""}
      ${done?`<button class="btn del" id="delDone">복습 완료 ${done}문항 삭제</button>`:""}
    </div>
    ${note?`<p class="notice">${note}</p>`:""}
    ${list.length ? `
      <div class="pager">
        <button class="btn ghost" id="nPrev" ${nIdx<=0?"disabled":""}>‹ 이전</button>
        <div class="pos">${nIdx+1} / ${list.length}<small>${esc(list[nIdx].unit)}</small></div>
        <button class="btn ghost" id="nNext" ${nIdx>=list.length-1?"disabled":""}>다음 ›</button>
      </div>
      <div class="slider"><div class="slide ${slideClass()}" id="nSlide">${noteCard(list[nIdx])}</div></div>
      <p class="swipehint">화면을 옆으로 밀어서 이전·다음 문제로 넘길 수 있어요</p>` : `<div class="card empty">${all.length? "조건에 맞는 오답이 없어요." : "아직 저장된 오답이 없어요.<br>문제를 채점한 뒤 <b>오답노트에 저장</b> 버튼을 누른 문제가 여기에 모여요."}</div>`}
  `;
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ nUnit=b.dataset.u; nIdx=0; renderNotes(); });
  $("#hideM").onchange = e => { hideMastered = e.target.checked; nIdx=0; renderNotes(); };
  if(list.length){
    const goNext = nIdx<list.length-1 ? ()=>{ nIdx++; slideDir=1; renderNotes(); } : null;
    const goPrev = nIdx>0 ? ()=>{ nIdx--; slideDir=-1; renderNotes(); } : null;
    $("#nNext").onclick = ()=>{ if(goNext){ const el=$("#nSlide"); el.classList.add("out-next"); setTimeout(goNext,170); } };
    $("#nPrev").onclick = ()=>{ if(goPrev){ const el=$("#nSlide"); el.classList.add("out-prev"); setTimeout(goPrev,170); } };
    attachSwipe($("#nSlide"), goNext, goPrev);
  }
  $("#coverA").onchange = e => { coverAns = e.target.checked; revealed = new Set(); renderNotes(); };
  document.querySelectorAll("[data-master]").forEach(b=>b.onclick=async()=>{
    const k=b.dataset.master, x={...NB.items[k]}; x.mastered=!x.mastered; x.masteredAt = x.mastered?today():null; await nbPut(k,x);
  });
  document.querySelectorAll("textarea.memo").forEach(t=>t.onchange=async()=>{
    const k=t.dataset.k, x={...NB.items[k]}; if((x.memo||"")===t.value) return; x.memo=t.value; await nbPut(k,x);
  });
  document.querySelectorAll("#notes .opt").forEach(el=>el.onclick=()=>{
    const k=el.dataset.k; if(!coverAns || revealed.has(k)) return;
    revealed.add(k); _tries[k] = +el.dataset.o; renderNotes();
    const x = NB.items[k]; if(x) nbRecordTry(k, _tries[k] === x.ans);
  });
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    const x = NB.items[b.dataset.del]; if(!x) return;
    ask(`${x.round}회 ${x.qno}번 문제를 오답노트에서 삭제할까요? 메모도 함께 지워지고 되돌릴 수 없어요.`, "삭제", ()=>nbDel(b.dataset.del));
  });
  const so = $("#sumOpen"); if(so) so.onclick = ()=>{ sumView = true; renderNotes(); window.scrollTo(0,0); };
  const ds = $("#drStart");
  if(ds) ds.onclick = ()=>startDrill(noteFilter(Object.entries(NB.items).map(([k,v])=>({key:k, ...v}))).map(x=>x.key));
  const dd = $("#delDone");
  if(dd) dd.onclick = ()=>{
    const keys = Object.keys(NB.items).filter(k=>NB.items[k].mastered);
    ask(`복습 완료한 ${keys.length}문항을 오답노트에서 모두 삭제할까요? 되돌릴 수 없어요.`, "모두 삭제", async()=>{ for(const k of keys) await nbDel(k); });
  };
  document.querySelectorAll("[data-reveal]").forEach(b=>b.onclick=()=>{ revealed.add(b.dataset.reveal); renderNotes(); });
}
const _tries = {};
function noteCard(x){
  const hidden = coverAns && !revealed.has(x.key);
  const tryPick = _tries[x.key];
  return `<article class="q ${x.mastered?"mastered":""} ${hidden?"":"done"}">
    <div class="qhead"><span class="qnum" style="min-width:auto">${x.round}회 ${x.qno}번</span>
      <span class="qmeta" style="margin-left:auto"><span class="dot" style="background:${UNIT_COLOR[x.unit]}"></span>${x.unit} · ${esc(x.topic)}</span>${starBtn(x.round, x.qno)}</div>
    <div class="nmeta">
      ${x.wrongCount ? `<span class="pill ${x.wrongCount>1?"hot":""}">틀린 횟수 ${x.wrongCount}</span>` : `<span class="pill">맞혔지만 저장한 문제</span>`}
      ${x.lastWrong?`<span class="pill">최근 오답 ${esc(x.lastWrong)}</span>`:""}
      ${x.lastRight?`<span class="pill">최근 정답 ${esc(x.lastRight)}</span>`:""}
      ${retryPills(x)}
      ${x.mastered?`<span class="pill">복습 완료</span>`:""}
    </div>
    <p class="stem" style="margin-top:10px">${esc(x.stem)}</p>
    ${x.box?`<div class="box">${esc(x.box)}</div>`:""}
    <ul class="opts">${x.opts.map((o,j)=>{
      let c="";
      if(!hidden){ if(j===x.ans) c="is-ans"; else if(j===x.myPick) c="is-wrongpick"; }
      return `<li class="opt ${c}" data-k="${x.key}" data-o="${j}"><span class="n">${CIRC[j]}</span><span>${esc(o)}${!hidden&&j===x.myPick&&j!==x.ans?' <span class="mark x">내가 고른 답</span>':""}</span></li>`;
    }).join("")}</ul>
    ${!hidden && tryPick!=null ? `<p class="saved" style="color:${tryPick===x.ans?"var(--ok)":"var(--bad)"}">다시 푼 답 ${CIRC[tryPick]} → ${tryPick===x.ans?"정답이에요!":"또 틀렸어요. 해설을 꼭 확인하세요."}</p>`:""}
    ${hidden?`<div class="nact"><span class="nstats">답을 골라 보거나</span><button class="btn ghost" data-reveal="${x.key}">정답·해설 보기</button></div>`:`
    <details class="exp" open><summary>정답 ${CIRC[x.ans]}${x.myPick!=null&&x.myPick>=0?` · 내 답 ${CIRC[x.myPick]}`:" · 미응답"}${x.myPick===x.ans?" (맞힘)":""} — 선지별 해설</summary>
      <ol>${x.why.map((w,j)=>`<li class="${j===x.ans?"ans":""}"><span class="tag">${CIRC[j]}</span><span>${j===x.ans?"(O) ":"(X) "}${esc(w)}</span></li>`).join("")}</ol>
    </details>`}
    ${sumBox(x)}
    <textarea class="memo" data-k="${x.key}" placeholder="나만의 암기 메모 — 왜 틀렸는지, 외울 포인트를 적어 두세요 (정리본에 함께 들어가요)">${esc(x.memo||"")}</textarea>
    <div class="nact"><button class="btn ${x.mastered?"ghost":""}" data-master="${x.key}">${x.mastered?"다시 복습 목록으로":"복습 완료"}</button>
      <button class="btn del" data-del="${x.key}">삭제</button></div>
  </article>`;
}

async function saveOne(r, i){
  savedRun.add(i);
  return saveQ(r, i, picks[i]);
}
async function saveQ(r, i, pickIn){
  const q = r.questions[i], key = `r${r.round}-q${i+1}`, ex = NB.items[key];
  const pick = pickIn==null ? -1 : pickIn;
  const right = pick === q.ans;
  const base = ex ? {...ex} : {round:r.round, qno:i+1, title:r.title, unit:q.unit, topic:q.topic, stem:q.stem, box:q.box, opts:q.opts, why:q.why, ans:q.ans, sum:q.sum||null, wrongCount:0, firstWrong:today(), memo:""};
  base.myPick = pick; base.lastSaved = today(); base.mastered = false; base.masteredAt = null;
  if(right){ base.lastRight = today(); base.wrongCount = base.wrongCount||0; }
  else { base.wrongCount = (base.wrongCount||0)+1; base.lastWrong = today(); }
  await nbPut(key, base);
  return true;
}
async function markRight(r, i){
  const key = `r${r.round}-q${i+1}`, ex = NB.items[key];
  if(picks[i] === r.questions[i].ans && ex && ex.lastRight !== today()) await nbPut(key, {...ex, lastRight: today()});
}
async function saveWrongs(r, onlyUnsaved){
  let n = 0;
  for(let i=0;i<r.questions.length;i++){
    if(picks[i] === r.questions[i].ans){ await markRight(r, i); continue; }
    if(onlyUnsaved && savedRun.has(i)) continue;
    if(await saveOne(r, i)) n++;
  }
  return n;
}
function wrongList(r){ return r.questions.map((q,i)=>picks[i]===q.ans?null:i+1).filter(Boolean); }

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmt(sec){ const m=Math.floor(Math.abs(sec)/60), s=Math.abs(sec)%60; return (sec<0?"-":"")+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); }

function unitCounts(r){
  const c = {}; r.questions.forEach(q=>c[q.unit]=(c[q.unit]||0)+1); return c;
}

let eIdx = 0;
function examIdxs(){
  const r = ROUNDS[cur];
  return r.questions.map((q,i)=>i).filter(i => !(submitted && onlyWrong && picks[i]===r.questions[i].ans));
}
function goQ(i){
  if(i === eIdx) return;
  const dir = i > eIdx ? 1 : -1, el = $("#eSlide");
  const run = () => {
    eIdx = i; slideDir = dir; renderExam(); renderOmr();
    const pg = $("#ePager"); if(pg && pg.getBoundingClientRect().top < 0) pg.scrollIntoView({block:"start"});
  };
  if(el){ el.classList.add(dir>0?"out-next":"out-prev"); setTimeout(run, 170); } else run();
}
function renderExam(){
  const r = ROUNDS[cur], idxs = examIdxs();
  if(!idxs.length){ $("#exam").innerHTML = `<div class="card empty">틀린 문항이 없어요!</div>`; return; }
  if(!idxs.includes(eIdx)) eIdx = idxs[0];
  const pos = idxs.indexOf(eIdx), qq = r.questions[eIdx];
  const prevI = pos>0 ? idxs[pos-1] : null, nextI = pos<idxs.length-1 ? idxs[pos+1] : null;
  const card = [qq].map((q)=>{ const i = eIdx;
    const done = submitted || (practice && checked[i]), ok = done && picks[i]===q.ans;
    const pendingCheck = practice && !submitted && !checked[i];
    const cls = done ? (ok?"correct":"wrong") : "";
    if (submitted && onlyWrong && ok) return "";
    return `<article class="q ${cls} ${done?"done":""}" id="q${i+1}">
      <div class="qhead"><span class="qnum">${i+1}.</span>
        <p class="stem">${esc(q.stem)}</p>
        <span class="qmeta"><span class="dot" style="background:${UNIT_COLOR[q.unit]}"></span>${q.unit} · ${esc(q.topic)}</span>
        ${starBtn(r.round, i+1)}
      </div>
      ${q.box?`<div class="box">${esc(q.box)}</div>`:""}
      <ul class="opts">${q.opts.map((o,j)=>{
        let c = "";
        if(!done && picks[i]===j) c="sel";
        if(done && j===q.ans) c="is-ans";
        if(done && picks[i]===j && j!==q.ans) c="is-wrongpick";
        return `<li class="opt ${c}" data-q="${i}" data-o="${j}"><span class="n">${CIRC[j]}</span><span>${esc(o)}</span></li>`;
      }).join("")}</ul>
      ${pendingCheck?`<div class="nact"><button class="btn" data-check="${i}" ${picks[i]==null?"disabled":""}>제출하고 채점하기</button>${picks[i]==null?'<span class="nstats">보기를 먼저 골라 주세요</span>':""}</div>`:""}
      ${done ? `<div class="nact">${savedRun.has(i)?'<span class="saved" style="margin:0">✓ 오답노트에 저장했어요</span> <a href="#notes" style="font-size:13px">오답노트 보기</a>':`<button class="btn ghost" data-save="${i}">오답노트에 저장</button>${ok?'<span class="nstats">맞혔지만 헷갈렸다면 저장해 두세요</span>':""}`}</div>`:""}
      ${done?`<details class="exp" ${ok&&!(practice&&!submitted)?"":"open"}>
        <summary>${ok?'<span class="mark o">정답</span>':'<span class="mark x">오답</span>'} &nbsp;정답 ${CIRC[q.ans]}${picks[i]!=null&&!ok?` · 내 답 ${CIRC[picks[i]]}`:(picks[i]==null?" · 미응답":"")} — 해설 보기</summary>
        <ol>${q.why.map((w,j)=>`<li class="${j===q.ans?"ans":""}"><span class="tag">${CIRC[j]}</span><span>${j===q.ans?"(O) ":"(X) "}${esc(w)}</span></li>`).join("")}</ol>
      </details>`:""}
    </article>`;
  }).join("");
  const filt = submitted && onlyWrong;
  $("#exam").innerHTML = `
    <div class="modebar">
      <span class="modetag ${practice?"pr":"re"}">${practice?"연습 모드":"실전 모드"}</span>
      <span class="nstats">${esc(r.title)}</span>
      <span class="sp"></span>
      <button class="btn ghost" id="exitBtn">나가기</button>
    </div>
    <div class="pager" id="ePager">
      <button class="btn ghost" id="ePrev" ${prevI==null?"disabled":""}>‹ 이전</button>
      <div class="pos">${filt?`틀린 문항 ${pos+1} / ${idxs.length}`:`${eIdx+1} / ${r.questions.length}`}<small>${esc(qq.unit)}${filt?` · ${eIdx+1}번`:""}</small></div>
      <button class="btn ghost" id="eNext" ${nextI==null?"disabled":""}>다음 ›</button>
    </div>
    <div class="slider"><div class="slide ${slideClass()}" id="eSlide">${card}</div></div>
    <p class="swipehint">화면을 옆으로 밀거나 아래 번호를 눌러 문제를 이동할 수 있어요</p>`;
  $("#exitBtn").onclick = exitExam;
  $("#ePrev").onclick = ()=>{ if(prevI!=null) goQ(prevI); };
  $("#eNext").onclick = ()=>{ if(nextI!=null) goQ(nextI); };
  const sl = $("#eSlide");
  attachSwipe(sl, nextI!=null ? ()=>{ eIdx=nextI; slideDir=1; renderExam(); renderOmr(); } : null,
                  prevI!=null ? ()=>{ eIdx=prevI; slideDir=-1; renderExam(); renderOmr(); } : null);
  if(!submitted){
    document.querySelectorAll("#exam .opt").forEach(el=>el.onclick=()=>{
      const qi=+el.dataset.q, oi=+el.dataset.o;
      if(practice && checked[qi]) return;
      picks[qi] = picks[qi]===oi ? null : oi;
      renderExam(); renderOmr();
    });
    document.querySelectorAll("[data-check]").forEach(b=>b.onclick=()=>{
      const i=+b.dataset.check; if(picks[i]==null) return;
      checked[i] = true; renderExam(); renderOmr();
      markRight(ROUNDS[cur], i);
    });
  }
  document.querySelectorAll("[data-save]").forEach(b=>b.onclick=async()=>{
    b.disabled = true; b.textContent = "저장 중…";
    await saveOne(ROUNDS[cur], +b.dataset.save); renderExam();
    if(submitted) updUnsaved();
  });
}

function renderOmr(){
  const r = ROUNDS[cur];
  $("#omr").innerHTML = r.questions.map((q,i)=>{
    let c = "";
    if(submitted || (practice && checked[i])) c = picks[i]===q.ans ? "o" : "x";
    else if(picks[i]!=null) c = "f";
    return `<a href="javascript:void 0" data-go="${i}" class="${c} ${i===eIdx?"cur":""}">${i+1}</a>`;
  }).join("");
  document.querySelectorAll("#omr a").forEach(a=>a.onclick=e=>{
    e.preventDefault(); const i = +a.dataset.go;
    if(submitted && onlyWrong && picks[i]===r.questions[i].ans){ onlyWrong=false; const ow=$("#onlyWrong"); if(ow) ow.checked=false; }
    goQ(i);
  });
  const om = $("#omr"), ca = om.querySelector("a.cur");
  if(ca && om.scrollWidth > om.clientWidth) om.scrollLeft = ca.offsetLeft - om.clientWidth/2 + ca.offsetWidth/2 - om.offsetLeft;
  if(practice && !submitted){
    const n = checked.filter(Boolean).length, c = picks.filter((p,i)=>checked[i] && p===r.questions[i].ans).length;
    $("#submitBtn").textContent = n===r.questions.length ? "결과 보기" : `결과 ${c}/${n}`;
  } else $("#submitBtn").textContent = "제출";
}

function start(mode){
  practice = !!mode; savedRun = new Set();
  checked = Array(ROUNDS[cur].questions.length).fill(false);
  picks = Array(ROUNDS[cur].questions.length).fill(null);
  submitted = false; onlyWrong = false; started = Date.now(); eIdx = 0;
  $("#intro").classList.add("hide"); $("#result").classList.add("hide");
  $("#exam").classList.remove("hide"); $("#bar").classList.remove("hide");
  $("#submitBtn").classList.remove("hide");
  renderExam(); renderOmr();
  clearInterval(tick); tick = setInterval(updTimer, 500); updTimer();
  window.scrollTo(0,0);
}
function elapsed(){ return Math.floor((Date.now()-started)/1000); }
function updTimer(){
  const left = LIMIT - elapsed();
  $("#timer").textContent = fmt(left);
  $("#timer").classList.toggle("warn", left < 180);
}

function askSubmit(){
  const n = practice ? checked.filter(x=>!x).length : picks.filter(p=>p==null).length;
  if(n===0) return submit();
  $("#mOk").textContent = "제출하기"; $("#mCancel").textContent = "계속 풀기";
  $("#modalMsg").textContent = practice ? `아직 채점하지 않은 문항이 ${n}개 있어요. 지금 결과를 볼까요? (고른 답은 함께 채점돼요)` : `아직 풀지 않은 문항이 ${n}개 있어요. 그래도 제출할까요?`;
  $("#modal").classList.remove("hide");
}

function submit(){
  $("#modal").classList.add("hide");
  submitted = true; clearInterval(tick); eIdx = 0;
  const r = ROUNDS[cur], t = elapsed();
  const per = {}; let correct = 0;
  r.questions.forEach((q,i)=>{
    per[q.unit] = per[q.unit] || {c:0,n:0}; per[q.unit].n++;
    if(picks[i]===q.ans){ per[q.unit].c++; correct++; }
  });
  const score = correct*4;
  const h = store.get("socexam-hist-"+r.round) || [];
  const d = new Date(); h.push({score, time:t, date:`${d.getMonth()+1}/${d.getDate()}`});
  store.set("socexam-hist-"+r.round, h.slice(-20));

  $("#result").innerHTML = `
    <div class="score"><span class="big">${score}점</span><span class="sub">${correct} / ${r.questions.length} 정답 · 풀이 시간 ${fmt(t)}${t>LIMIT?" (권장 시간 초과)":""}</span></div>
    <div class="ubars">${Object.entries(per).map(([u,v])=>`
      <div class="ubar"><span><span class="dot" style="background:${UNIT_COLOR[u]}"></span>${u}</span>
      <div class="track"><div class="fill" style="width:${v.c/v.n*100}%;background:${UNIT_COLOR[u]}"></div></div>
      <span>${v.c}/${v.n}</span></div>`).join("")}</div>
    <div class="tools">
      <label class="toggle"><input type="checkbox" id="onlyWrong"> 틀린 문항만 보기</label>
      <button class="btn ghost" id="copyBtn">오답 번호 복사</button>
      <button class="btn" id="retryBtn">같은 모드로 다시 풀기</button>
      <button class="btn ghost" id="modeBtn">다른 모드 선택</button>
      <span id="copyMsg" class="sub" style="font-size:13px;color:var(--muted)"></span>
    </div>
    <p class="saved" id="saveMsg"></p>`;
  const rec = {round:r.round, mode:practice?"연습":"실전", score, correct, time:t, date:today(), at:new Date().toISOString(), wrong:wrongList(r)};
  updUnsaved(); nbAttempt(rec);
  $("#result").classList.remove("hide");
  $("#submitBtn").classList.add("hide");
  $("#onlyWrong").onchange = e => { onlyWrong = e.target.checked; eIdx = -1; renderExam(); renderOmr(); };
  $("#retryBtn").onclick = () => start(practice);
  $("#modeBtn").onclick = () => { reset(); window.scrollTo(0,0); };
  $("#copyBtn").onclick = async () => {
    const wrong = r.questions.map((q,i)=>picks[i]===q.ans?null:`${i+1}번(${q.topic})`).filter(Boolean);
    const txt = `${r.title} ${score}점 / 오답: ${wrong.join(", ")||"없음"}`;
    try{ await navigator.clipboard.writeText(txt); $("#copyMsg").textContent="복사했어요. 오답노트 만들 때 붙여 넣어 주세요."; }
    catch(e){ $("#copyMsg").textContent = txt; }
  };
  renderExam(); renderOmr();
  window.scrollTo(0,0);
}

function exitExam(){
  const answered = practice ? checked.filter(Boolean).length : picks.filter(p=>p!=null).length;
  if(submitted || answered === 0){ reset(); window.scrollTo(0,0); return; }
  ask(`풀던 문제(${answered}문항)를 그만두고 모드 선택 화면으로 나갈까요? 지금까지 고른 답은 사라져요. (오답노트에 저장한 문제는 그대로 남아요)`, "나가기", ()=>{ reset(); window.scrollTo(0,0); });
}
function updUnsaved(){
  const m = $("#saveMsg"); if(!m) return;
  const n = savedRun.size;
  m.style.color = n ? "var(--ok)" : "var(--muted)";
  m.innerHTML = n ? `이번 풀이에서 ${n}문항을 오답노트에 저장했어요. <a href="#notes">오답노트 보기 →</a>`
    : "오답노트에 남길 문제는 각 문제 아래 <b>오답노트에 저장</b> 버튼을 눌러 주세요.";
}

function reset(){
  clearInterval(tick); submitted=false;
  $("#intro").classList.remove("hide"); $("#result").classList.add("hide");
  $("#exam").classList.add("hide"); $("#bar").classList.add("hide");
  renderIntro();
}

$("#submitBtn").onclick = askSubmit;
$("#mCancel").onclick = () => { askCb = null; $("#modal").classList.add("hide"); };
$("#mOk").onclick = () => { if(askCb){ const f = askCb; askCb = null; $("#modal").classList.add("hide"); f(); } else submit(); };
renderSel(); reset();
setView(hashView());
nbInit();
dyInit();
bmInit();
oxInit();
oxbInit();
// 자정이 지나면 새 문제로
setInterval(()=>{ const d = today(); if(d !== window.__lastDay){ window.__lastDay = d; tPick = null; dyChanged(); } }, 60000); window.__lastDay = today();
</script>
<script>
if ("serviceWorker" in navigator) {
  const hadCtrl = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadCtrl && !reloaded) { reloaded = true; location.reload(); } });
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(r => r.update()).catch(()=>{}));
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(()=>{}); });
}
</script>
</body>
</html>
